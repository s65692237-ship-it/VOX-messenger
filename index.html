<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vox Messenger</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --bg-color: #0f172a;
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #0f172a 50%);
            --sidebar-bg: rgba(15, 23, 42, 0.75);
            --chat-bg: rgba(15, 23, 42, 0.5);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --msg-in: #1e293b;
            --msg-out: #4c1d95;
            --msg-out-text: #ffffff;
            --glass-effect: blur(20px);
            --chat-wallpaper: none;
            --danger: #ef4444;
            --online: #10b981;
        }

        body.light-theme {
            --bg-color: #f8fafc;
            --bg-gradient: none;
            --sidebar-bg: #ffffff;
            --chat-bg: #f1f5f9;
            --border-color: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #6d28d9;
            --msg-in: #e2e8f0;
            --msg-out: #8b5cf6;
            --msg-out-text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent;}
        
        body {
            background-color: var(--bg-color); color: var(--text-main); 
            height: 100vh; height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; background-image: var(--bg-gradient); font-size: 14px;
        }

        /* --- ЭКРАН АВТОРИЗАЦИИ --- */
        #auth-screen {
            position: fixed; inset: 0; background: var(--bg-color); z-index: 1000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
        }
        .auth-box {
            background: var(--sidebar-bg); padding: 40px 30px; border-radius: 24px;
            border: 1px solid var(--border-color); width: 100%; max-width: 400px;
            text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: var(--glass-effect);
        }
        .auth-box h1 { font-size: 36px; color: var(--accent); margin-bottom: 10px; letter-spacing: 2px;}
        .auth-box p { color: var(--text-muted); margin-bottom: 20px; }
        .auth-avatar-container {
            width: 100px; height: 100px; border-radius: 50%; background: var(--chat-bg);
            margin: 0 auto 20px; cursor: pointer; overflow: hidden;
            border: 2px solid var(--accent); display: flex; justify-content: center; align-items: center;
            transition: 0.3s;
        }
        .auth-avatar-container:hover { border-color: var(--text-main); }
        .auth-avatar-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .auth-avatar-container span { font-size: 30px; color: var(--text-muted); }
        
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 15px; background: var(--chat-bg);
            border: 1px solid var(--border-color); border-radius: 12px;
            color: var(--text-main); font-size: 16px; margin-bottom: 15px; outline: none; text-align: center; transition: 0.2s;
        }
        input:focus { border-color: var(--accent); }
        
        .auth-box button {
            width: 100%; padding: 15px; background: var(--accent); color: #fff;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 10px;
        }
        .auth-box button:hover { background: var(--accent-hover); }
        .auth-toggle { font-size: 13px; color: var(--text-muted); cursor: pointer; text-decoration: underline; margin-top: 10px;}

        /* --- УВЕДОМЛЕНИЯ --- */
        #notification-container { position: fixed; top: 20px; right: 20px; z-index: 3000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;}
        .notification {
            background: var(--sidebar-bg); border: 1px solid var(--accent);
            padding: 15px 20px; border-radius: 12px; color: var(--text-main);
            min-width: 250px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideIn 0.3s forwards; display: flex; align-items: center; gap: 10px; 
            backdrop-filter: var(--glass-effect); pointer-events: auto;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

        /* --- ОСНОВНОЙ ИНТЕРФЕЙС --- */
        .vox-container {
            width: 100%; height: 100%; max-width: 1400px; max-height: 900px;
            background: var(--chat-bg); backdrop-filter: var(--glass-effect);
            border: 1px solid var(--border-color); border-radius: 24px;
            display: flex; overflow: hidden; position: relative; display: none;
        }

        /* --- САЙДБАР --- */
        .sidebar { width: 380px; border-right: 1px solid var(--border-color); background: var(--sidebar-bg); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);}
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .user-profile { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--accent); display: flex; justify-content: center; align-items: center; font-weight: bold; overflow: hidden; position: relative; cursor: pointer; color: white;}
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .status-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--sidebar-bg); background: var(--online); }
        .user-info { display: flex; flex-direction: column; cursor: pointer; flex: 1; }
        .user-name { font-weight: 600; color: var(--text-main); font-size: 16px;}
        .user-id { font-size: 12px; color: var(--text-muted); }
        .settings-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; margin-left: auto; padding: 5px;}
        .add-friend-btn { background: var(--accent); border: none; color: #fff; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: 20px; display: flex; justify-content: center; align-items: center; margin-left: 10px;}
        .search-bar input { width: 100%; padding: 12px 15px; background: var(--chat-bg); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); font-size: 14px; outline: none; }
        
        .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item { display: flex; align-items: center; padding: 15px; border-radius: 16px; cursor: pointer; margin-bottom: 5px; position: relative; transition: 0.2s;}
        .chat-item:hover { background: rgba(255, 255, 255, 0.05); }
        body.light-theme .chat-item:hover { background: rgba(0, 0, 0, 0.05); }
        .chat-item.active { background: rgba(139, 92, 246, 0.15); border-left: 3px solid var(--accent); }
        .avatar { width: 54px; height: 54px; border-radius: 50%; background: linear-gradient(135deg, #8b5cf6, #3b82f6); display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 15px; flex-shrink: 0; overflow: hidden; color: white; font-size: 20px; position: relative;}
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: none;}
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; color: var(--text-main); display:flex; align-items:center; gap:5px;}
        .chat-last-msg { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .icon-group { font-size: 14px; color: var(--text-muted);}

        /* --- ЧАТ --- */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); position: relative; background-image: var(--chat-wallpaper); background-size: cover; background-position: center;}
        .chat-header { padding: 10px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; background: var(--sidebar-bg); min-height: 70px;}
        .back-btn { display: none; background: none; border: none; color: var(--accent); font-size: 26px; cursor: pointer; margin-right: 10px; width: 40px; height: 40px; align-items: center; justify-content: center;}
        .chat-header-avatar { width: 45px; height: 45px; border-radius: 50%; margin-right: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; background: var(--accent); color: white; font-weight: bold; font-size: 18px;}
        .chat-header-avatar img { width: 100%; height: 100%; object-fit: cover; display: none;}
        .chat-header-info { font-size: 17px; font-weight: 600; color: var(--text-main); }
        .chat-header-status { font-size: 13px; color: var(--accent); }
        
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 75%; display: flex; flex-direction: column; position: relative; animation: popIn 0.2s;}
        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.incoming { align-self: flex-start; }
        .message.outgoing { align-self: flex-end; align-items: flex-end; }
        
        .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; padding-bottom: 20px;}
        .message.incoming .msg-bubble { background: var(--msg-in); color: var(--text-main); border-bottom-left-radius: 4px; }
        .message.outgoing .msg-bubble { background: var(--msg-out); color: var(--msg-out-text); border-bottom-right-radius: 4px; }
        
        .sender-name { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 4px; display: block;}
        .message.outgoing .sender-name { display: none; }

        .reply-quote { font-size: 12px; color: rgba(255,255,255,0.7); border-left: 2px solid rgba(255,255,255,0.5); padding-left: 8px; margin-bottom: 5px; font-style: italic; }
        .message.incoming .reply-quote { color: var(--accent); border-left-color: var(--accent); }
        
        .reaction { position: absolute; bottom: -8px; background: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 2px 6px; font-size: 13px; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}
        .message.incoming .reaction { left: 10px; }
        .message.outgoing .reaction { right: 10px; }
        
        .message.image .msg-bubble { background: transparent; padding: 0; }
        .message.image img { max-width: 250px; border-radius: 12px; }
        .message.voice .msg-bubble { background: transparent; padding: 0; }
        audio { max-width: 220px; outline: none; border-radius: 20px; }
        
        .msg-time { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 3px;}
        .message.incoming .msg-time { color: var(--text-muted); }
        .checkmark { color: #60a5fa; font-size: 12px;}
        .checkmark.read { color: #8b5cf6; }

        .input-area { padding: 10px 15px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; background: var(--sidebar-bg); align-items: center; padding-bottom: max(10px, env(safe-area-inset-bottom)); position: relative;}
        .icon-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); transition: 0.2s; width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; flex-shrink: 0;}
        .icon-btn:hover { color: var(--accent); background: var(--chat-bg);}
        .input-area input { flex: 1; padding: 12px 15px; background: var(--chat-bg); border: 1px solid var(--border-color); border-radius: 20px; color: var(--text-main); outline: none; transition: 0.2s; font-size: 16px; min-width: 0;}
        .input-area input:focus { border-color: var(--accent); }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; flex-shrink: 0;}
        .send-btn:hover { background: var(--accent-hover); }

        /* Панели */
        .panel { position: absolute; bottom: 70px; left: 15px; right: 15px; background: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 10px; z-index: 10; display: none; box-shadow: 0 -5px 20px rgba(0,0,0,0.3); backdrop-filter: var(--glass-effect);}
        .panel.active { display: grid; }
        #stickerPanel { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; height: 200px; overflow-y: auto;}
        #stickerPanel img { width: 100%; height: 100%; object-fit: contain; cursor: pointer; transition: 0.2s; padding: 5px;}
        #stickerPanel img:hover { transform: scale(1.1); background: rgba(139, 92, 246, 0.2); border-radius: 8px;}
        #emojiPanel { grid-template-columns: repeat(6, 1fr); gap: 5px; max-height: 200px; overflow-y: auto;}
        #emojiPanel span { font-size: 24px; cursor: pointer; text-align: center; padding: 5px; border-radius: 8px; transition: 0.1s;}
        #emojiPanel span:hover { background: rgba(139, 92, 246, 0.2);}

        /* Контекстное меню */
        .ctx-menu { position: fixed; background: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 5px; z-index: 5000; display: none; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 150px; backdrop-filter: var(--glass-effect); }
        .ctx-menu button { padding: 12px 15px; background: none; border: none; color: var(--text-main); text-align: left; cursor: pointer; border-radius: 8px; font-size: 14px; transition: 0.1s; display: flex; align-items: center; gap: 10px;}
        .ctx-menu button:hover { background: rgba(139, 92, 246, 0.2); }

        /* Модалки */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 4000; justify-content: center; align-items: center; padding: 20px;}
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--sidebar-bg); padding: 30px; border-radius: 24px; text-align: center; width: 100%; max-width: 360px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border-color); backdrop-filter: var(--glass-effect);}
        .modal-card h2 { color: var(--text-main); margin-bottom: 20px; }
        .modal-card input { width: 100%; padding: 15px; background: var(--chat-bg); border: 1px solid var(--accent); border-radius: 10px; color: var(--text-main); margin-bottom: 20px; text-align: center; font-size: 16px; outline: none;}
        
        .edit-avatar-container { width: 100px; height: 100px; border-radius: 50%; background: var(--chat-bg); margin: 0 auto 20px; overflow: hidden; cursor: pointer; border: 2px solid var(--accent); display: flex; justify-content: center; align-items: center;}
        .edit-avatar-container img { width: 100%; height: 100%; object-fit: cover; display: none;}
        .edit-avatar-container span { font-size: 30px; color: var(--text-muted);}

        .settings-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: var(--text-main); }
        .settings-btn-group { display: flex; gap: 5px; }
        .settings-opt { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--chat-bg); color: var(--text-main); cursor: pointer; transition: 0.2s; font-size: 13px;}
        .settings-opt.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        
        .wallpaper-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px;}
        .wallpaper-item { aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent; background-size: cover; background-position: center; transition: 0.2s;}
        .wallpaper-item.selected { border-color: var(--accent); }
        .wallpaper-item.none { background: var(--chat-bg); display: flex; justify-content: center; align-items: center; font-size: 11px; color: var(--text-muted); }

        @media (max-width: 768px) {
            .vox-container { border-radius: 0; border: none; max-height: 100%; }
            .sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; position: absolute; z-index: 5; height: 100%; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            .chat-area.active { transform: translateX(0); }
            .back-btn { display: flex; }
            .message { max-width: 85%; }
            .chat-header { padding-top: max(10px, env(safe-area-inset-top)); }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h1>VOX</h1>
            <p id="auth-subtitle">Вход в аккаунт</p>
            <div class="auth-avatar-container" id="avatar-upload-block" onclick="document.getElementById('authAvatarInput').click()" style="display:none;">
                <img id="authAvatarImg" src="" alt="Avatar">
                <span id="authAvatarText">📷</span>
            </div>
            <input type="file" id="authAvatarInput" accept="image/*" style="display: none;" onchange="processAvatar(event, 'auth')">
            <input type="email" id="authEmailInput" placeholder="Ваш Email">
            <input type="password" id="authPasswordInput" placeholder="Пароль">
            <button onclick="handleAuth()">ВОЙТИ</button>
            <div class="auth-toggle" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</div>
        </div>
    </div>

    <div id="notification-container"></div>

    <div class="ctx-menu" id="ctxMenu">
        <button onclick="ctxReply()">↩️ Ответить</button>
        <button onclick="ctxReact()">❤️ Реакция</button>
        <button onclick="ctxEdit()" id="ctxEditBtn">✏️ Редактировать</button>
        <button onclick="ctxDelete()" style="color:var(--danger);">🗑️ Удалить</button>
    </div>

    <div class="modal-overlay" id="edit-profile-modal" onclick="closeModal('edit-profile-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2>Мой профиль</h2>
            <div class="edit-avatar-container" onclick="document.getElementById('editAvatarInput').click()">
                <img id="editAvatarImg" src="" alt="Avatar">
                <span id="editAvatarText">📷</span>
            </div>
            <input type="file" id="editAvatarInput" accept="image/*" style="display: none;" onchange="processAvatar(event, 'edit')">
            <input type="text" id="editNameInput" placeholder="Новый никнейм" maxlength="15">
            <input type="text" id="editStatusInput" placeholder="Статус (о себе)" maxlength="30">
            <div style="display:flex; gap:10px;">
                <button onclick="closeModal('edit-profile-modal')" style="flex:1; padding:12px; background:var(--chat-bg); border:none; border-radius:10px; color:var(--text-main); cursor:pointer; font-weight:600;">Отмена</button>
                <button onclick="saveProfile()" style="flex:1; padding:12px; background:var(--accent); border:none; border-radius:10px; color:white; cursor:pointer; font-weight:600;">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="add-friend-modal" onclick="closeModal('add-friend-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2>Добавить</h2>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button onclick="switchAddTab('friend')" id="tab-friend" style="flex:1; padding:10px; border-radius:10px; border:none; background:var(--accent); color:white; cursor:pointer;">Друга</button>
                <button onclick="switchAddTab('group')" id="tab-group" style="flex:1; padding:10px; border-radius:10px; border:none; background:var(--chat-bg); color:var(--text-main); cursor:pointer;">Группу/Канал</button>
            </div>
            <div id="add-friend-pane">
                <input type="text" id="friendSearchInput" placeholder="Введите VOX ID друга">
                <div id="searchResult" style="margin-bottom:20px; color: var(--accent); font-size:14px; min-height:20px;"></div>
                <button onclick="searchFriend()" style="padding:12px; background:var(--accent); border:none; border-radius:10px; color:white; cursor:pointer; margin-bottom:10px; width:100%; font-weight:600;">Найти по ID</button>
            </div>
            <div id="add-group-pane" style="display:none;">
                <input type="text" id="groupNameInput" placeholder="Название">
                <select id="groupTypeSelect" style="width:100%; padding:15px; background:var(--chat-bg); border:1px solid var(--border-color); border-radius:10px; color:var(--text-main); margin-bottom:15px; font-size:16px; outline:none;">
                    <option value="group">👥 Группа</option>
                    <option value="channel">📢 Канал</option>
                </select>
                <button onclick="createGroup()" style="padding:12px; background:#10b981; border:none; border-radius:10px; color:white; cursor:pointer; margin-bottom:10px; width:100%; font-weight:600;">Создать</button>
            </div>
            <button onclick="closeModal('add-friend-modal')" style="padding:12px; background:var(--chat-bg); border:none; border-radius:10px; color:var(--text-main); cursor:pointer; width:100%; font-weight:600;">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay" id="invite-modal" onclick="closeModal('invite-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2>Добавить участника</h2>
            <div id="inviteList" style="text-align:left; max-height:200px; overflow-y:auto; margin-bottom:20px;"></div>
            <button onclick="closeModal('invite-modal')" style="padding:12px; background:var(--chat-bg); border:none; border-radius:10px; color:var(--text-main); cursor:pointer; width:100%; font-weight:600;">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay" id="edit-message-modal" onclick="closeModal('edit-message-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2>Редактировать</h2>
            <input type="text" id="editMsgInput">
            <div style="display:flex; gap:10px;">
                <button onclick="closeModal('edit-message-modal')" style="flex:1; padding:12px; background:var(--chat-bg); border:none; border-radius:10px; color:var(--text-main); cursor:pointer; font-weight:600;">Отмена</button>
                <button onclick="saveEditedMessage()" style="flex:1; padding:12px; background:var(--accent); border:none; border-radius:10px; color:white; cursor:pointer; font-weight:600;">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="search-messages-modal" onclick="closeModal('search-messages-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2>Поиск по чату</h2>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, get, child, update, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfoqJjADzqTjt6Fm5TscvJexQVlZeHloQ",
            authDomain: "vox-messenger-41233.firebaseapp.com",
            databaseURL: "https://vox-messenger-41233-default-rtdb.firebaseio.com",
            projectId: "vox-messenger-41233",
            storageBucket: "vox-messenger-41233.firebasestorage.app",
            messagingSenderId: "391369283601",
            appId: "1:391369283601:web:28ec1b0b0c0763e2bab9b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let currentUser = null; 
        let userID = null; 
        let isRegisterMode = false;
        let chatData = {}; 
        let usersDB = {};
        let groupsDB = {}; 
        let currentChatID = null;
        let currentChatStatus = 'offline';
        let typingTimeout = null;
        let tempAvatarBase64 = null;
        let replyTo = null;
        let isSending = false;
        let unsubscribeMessages = null;
        let unsubscribeStatus = null;
        let unsubscribeTyping = null;
        let ctxMsgKey = null;
        let ctxMsgData = null;
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let currentStream = null;

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-subtitle').innerText = isRegisterMode ? 'Регистрация' : 'Вход в аккаунт';
            document.querySelector('.auth-box button').innerText = isRegisterMode ? 'СОЗДАТЬ АККАУНТ' : 'ВОЙТИ';
            document.querySelector('.auth-toggle').innerText = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
            document.getElementById('avatar-upload-block').style.display = isRegisterMode ? 'flex' : 'none';
        };

        window.handleAuth = async function() {
            const email = document.getElementById('authEmailInput').value.trim();
            const password = document.getElementById('authPasswordInput').value;
            if (!email || !password) return alert('Заполните Email и пароль!');
            if (password.length < 6) return alert('Пароль должен быть минимум 6 символов!');

            try {
                if (isRegisterMode) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const newUid = userCredential.user.uid;
                    const voxId = 'VOX-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                    
                    await set(ref(db, 'users/' + newUid), {
                        name: email.split('@')[0],
                        voxId: voxId,
                        avatar: tempAvatarBase64 || null,
                        status: 'В сети Vox'
                    });
                    showNotification('Успех', 'Аккаунт создан!');
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                userID = user.uid;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                initApp();
            } else {
                userID = null;
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('authPasswordInput').value = '';
            }
        });

        window.processAvatar = function(event, context) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 100; canvas.height = 100;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 100, 100);
                    tempAvatarBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    
                    if (context === 'auth') {
                        document.getElementById('authAvatarImg').src = tempAvatarBase64;
                        document.getElementById('authAvatarImg').style.display = 'block';
                        document.getElementById('authAvatarText').style.display = 'none';
                    } else if (context === 'edit') {
                        document.getElementById('editAvatarImg').src = tempAvatarBase64;
                        document.getElementById('editAvatarImg').style.display = 'block';
                        document.getElementById('editAvatarText').style.display = 'none';
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        async function initApp() {
            onValue(ref(db, 'users'), (snapshot) => {
                usersDB = snapshot.val() || {};
                updateProfileUI();
                renderChatList();
            });

            onValue(ref(db, 'groups'), (snapshot) => {
                groupsDB = snapshot.val() || {};
                renderChatList();
            });

            onValue(ref(db, 'user_chats/' + userID), (snapshot) => {
                chatData = snapshot.val() || {};
                renderChatList();
            });

            const connectedRef = ref(db, '.info/connected');
            onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    const myStatusRef = ref(db, 'status/' + userID);
                    onDisconnect(myStatusRef).set('offline');
                    set(myStatusRef, 'online');
                }
            });

            const botCheck = await get(ref(db, 'user_chats/' + userID + '/VOX-BOT'));
            if (!botCheck.exists()) {
                set(ref(db, `user_chats/${userID}/VOX-BOT`), true);
            }
        }

        window.updateProfileUI = function() {
            const myData = usersDB[userID] || {};
            currentUser = myData.name || 'Гость';
            
            document.getElementById('myName').innerText = currentUser;
            document.getElementById('myID').innerText = 'ID: ' + (myData.voxId || '...');
            document.getElementById('myIdDisplay').innerText = myData.voxId || '...';
            
            if (myData.avatar) {
                document.getElementById('myAvatarImg').src = myData.avatar;
                document.getElementById('myAvatarImg').style.display = 'block';
                document.getElementById('myAvatarText').style.display = 'none';
            } else {
                document.getElementById('myAvatarText').innerText = currentUser[0].toUpperCase();
                document.getElementById('myAvatarImg').style.display = 'none';
                document.getElementById('myAvatarText').style.display = 'block';
            }
        };

        function renderChatList() {
            const container = document.getElementById('chatList');
            container.innerHTML = '';
            
            if (Object.keys(chatData).length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px; font-size:14px;">Нет чатов. Нажмите "+".</div>';
                return;
            }

            Object.keys(chatData).forEach(friendID => {
                let friendName = 'Неизвестно';
                let avatarHtml = '?';
                let isGroup = groupsDB[friendID] !== undefined;
                let iconHtml = '';

                if (friendID === 'VOX-BOT') {
                    friendName = 'Vox Бот';
                    avatarHtml = 'V';
                } else if (isGroup) {
                    const groupData = groupsDB[friendID];
                    friendName = groupData.name;
                    iconHtml = groupData.type === 'channel' ? '📢' : '👥';
                    avatarHtml = groupData.name[0].toUpperCase();
                } else {
                    const userData = usersDB[friendID] || { name: 'Удаленный юзер', avatar: null };
                    friendName = userData.name;
                    if (userData.avatar) {
                        avatarHtml = `<img src="${userData.avatar}" style="display:block">`;
                    } else {
                        avatarHtml = friendName[0].toUpperCase();
                    }
                }
                
                const msgs = chatData[friendID] ? chatData[friendID].messages : null;
                let lastMsg = 'Нет сообщений';
                if (msgs) {
                    const keys = Object.keys(msgs).sort();
                    if (keys.length > 0) {
                        const last = msgs[keys[keys.length - 1]];
                        lastMsg = last.type === 'image' ? '📷 Фото' : (last.type === 'voice' ? '🎙️ Голосовое' : (last.text || '[Медиа]'));
                    }
                }
                
                const div = document.createElement('div');
                div.className = 'chat-item' + (friendID === currentChatID ? ' active' : '');
                div.onclick = () => openChat(friendID, friendName, isGroup);
                
                div.innerHTML = `
                    <div class="avatar">
                        ${avatarHtml}
                        <div class="status-dot" style="display:${isGroup ? 'none' : 'block'}"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-name">${iconHtml} ${friendName}</div>
                        <div class="chat-last-msg">${lastMsg.length > 25 ? lastMsg.substring(0,25)+'...' : lastMsg}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.switchAddTab = function(tab) {
            if (tab === 'friend') {
                document.getElementById('add-friend-pane').style.display = 'block';
                document.getElementById('add-group-pane').style.display = 'none';
                document.getElementById('tab-friend').style.background = 'var(--accent)';
                document.getElementById('tab-friend').style.color = 'white';
                document.getElementById('tab-group').style.background = 'var(--chat-bg)';
                document.getElementById('tab-group').style.color = 'var(--text-main)';
            } else {
                document.getElementById('add-friend-pane').style.display = 'none';
                document.getElementById('add-group-pane').style.display = 'block';
                document.getElementById('tab-group').style.background = 'var(--accent)';
                document.getElementById('tab-group').style.color = 'white';
                document.getElementById('tab-friend').style.background = 'var(--chat-bg)';
                document.getElementById('tab-friend').style.color = 'var(--text-main)';
            }
        };

        window.createGroup = async function() {
            const name = document.getElementById('groupNameInput').value.trim();
            const type = document.getElementById('groupTypeSelect').value;
            if (!name) return alert('Введите название!');

            const groupId = 'GRP-' + Date.now();
            await set(ref(db, 'groups/' + groupId), {
                name: name,
                type: type,
                creator: userID,
                members: { [userID]: true }
            });

            await set(ref(db, `user_chats/${userID}/${groupId}`), true);
            
            closeModal('add-friend-modal');
            openChat(groupId, name, true);
            showNotification('Успех', 'Создано!');
        };

        window.openInviteModal = function() {
            if (!currentChatID || !groupsDB[currentChatID]) return;
            const container = document.getElementById('inviteList');
            container.innerHTML = '';
            
            Object.keys(usersDB).forEach(uid => {
                if (uid === userID || groupsDB[currentChatID].members[uid]) return;
                const user = usersDB[uid];
                const div = document.createElement('div');
                div.style.padding = '10px';
                div.style.borderBottom = '1px solid var(--border-color)';
                div.style.cursor = 'pointer';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.innerHTML = `<div class="avatar" style="width:30px; height:30px; font-size:12px; margin-right:10px;">${user.avatar ? `<img src="${user.avatar}" style="display:block">` : user.name[0]}</div> ${user.name}`;
                div.onclick = async () => {
                    await update(ref(db, `groups/${currentChatID}/members`), { [uid]: true });
                    await set(ref(db, `user_chats/${uid}/${currentChatID}`), true);
                    showNotification('Группа', 'Участник добавлен!');
                };
                container.appendChild(div);
            });
            openModal('invite-modal');
        };

        window.openChat = function(friendID, friendName, isGroup) {
            if (isRecording) stopVoiceRecord();
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            if (window.innerWidth <= 768) document.getElementById('msgInput').blur();

            // Сбрасываем статус печати у старого чата
            if (currentChatID && currentChatID !== 'VOX-BOT') set(ref(db, 'typing/' + userID + '/' + currentChatID), 'idle');

            currentChatID = friendID;
            
            document.getElementById('headerName').innerText = friendName;
            document.getElementById('inviteBtn').style.display = isGroup ? 'block' : 'none';
            
            let avatarSrc = null;
            if (isGroup && groupsDB[friendID]) {
                avatarSrc = null;
            } else if (usersDB[friendID]) {
                avatarSrc = usersDB[friendID].avatar;
            }

            if (avatarSrc) {
                document.getElementById('headerAvatarImg').src = avatarSrc;
                document.getElementById('headerAvatarImg').style.display = 'block';
                document.getElementById('headerAvatarText').style.display = 'none';
            } else {
                document.getElementById('headerAvatarText').innerText = friendName[0].toUpperCase();
                document.getElementById('headerAvatarText').style.display = 'block';
                document.getElementById('headerAvatarImg').style.display = 'none';
            }

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('chatArea').classList.add('active');
            }
            
            renderChatList();

            // ОТПИСЫВАЕМСЯ ОТ СТАРЫХ СЛУШАТЕЛЕЙ
            if (unsubscribeMessages) unsubscribeMessages();
            if (unsubscribeStatus) unsubscribeStatus();
            if (unsubscribeTyping) unsubscribeTyping();

            // СЛУШАЕМ СТАТУС И ПЕЧАТЬ
            if (!isGroup && friendID !== 'VOX-BOT') {
                const statusRef = ref(db, 'status/' + friendID);
                const typingRef = ref(db, 'typing/' + friendID + '/' + userID);
                
                unsubscribeStatus = onValue(statusRef, (snapshot) => {
                    currentChatStatus = snapshot.val() || 'offline';
                    updateChatHeaderStatus(isGroup, friendID);
                    if (chatData[friendID]?.messages) renderMessages(chatData[friendID].messages, isGroup);
                });
                
                unsubscribeTyping = onValue(typingRef, (snapshot) => {
                    if (snapshot.val() === 'typing') {
                        document.getElementById('typingStatus').innerText = 'печатает...';
                        document.getElementById('typingStatus').style.color = 'var(--accent)';
                    } else {
                        updateChatHeaderStatus(isGroup, friendID);
                    }
                });
            } else {
                currentChatStatus = 'online';
                updateChatHeaderStatus(isGroup, friendID);
            }

            const chatID = [userID, friendID].sort().join('_');
            const messagesRef = ref(db, 'messages/' + chatID);
            
            unsubscribeMessages = onValue(messagesRef, (snapshot) => {
                const msgs = snapshot.val() || {};
                renderMessages(msgs, isGroup);
            });
        };

        function updateChatHeaderStatus(isGroup, friendID) {
            const statusEl = document.getElementById('typingStatus');
            if (isGroup) {
                statusEl.innerText = groupsDB[friendID]?.type === 'channel' ? 'канал' : 'группа';
                statusEl.style.color = 'var(--text-muted)';
            } else if (friendID === 'VOX-BOT') {
                statusEl.innerText = 'онлайн';
                statusEl.style.color = 'var(--online)';
            } else {
                statusEl.innerText = currentChatStatus === 'online' ? 'в сети' : 'был(а) недавно';
                statusEl.style.color = currentChatStatus === 'online' ? 'var(--online)' : 'var(--text-muted)';
            }
        }

        window.closeChat = function() {
            if (isRecording) stopVoiceRecord();
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById('msgInput').blur();
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('chatArea').classList.remove('active');
            
            if (currentChatID && currentChatID !== 'VOX-BOT') set(ref(db, 'typing/' + userID + '/' + currentChatID), 'idle');
            
            currentChatID = null;
            if (unsubscribeMessages) unsubscribeMessages();
            if (unsubscribeStatus) unsubscribeStatus();
            if (unsubscribeTyping) unsubscribeTyping();
        };

        function renderMessages(msgsObj, isGroup) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            const msgs = Object.keys(msgsObj).map(key => ({ key, ...msgsObj[key] })).sort((a, b) => a.timestamp - b.timestamp);
            let lastDate = '';

            msgs.forEach(msg => {
                const msgDate = new Date(msg.timestamp).toLocaleDateString('ru-RU');
                if (msgDate !== lastDate) {
                    const dateDiv = document.createElement('div');
                    dateDiv.style.textAlign = 'center';
                    dateDiv.style.margin = '15px 0 5px 0';
                    dateDiv.innerHTML = `<span style="background:rgba(0,0,0,0.2); padding:4px 10px; border-radius:10px; font-size:12px; color:var(--text-muted); font-weight:600;">${msgDate}</span>`;
                    container.appendChild(dateDiv);
                    lastDate = msgDate;
                }

                const div = document.createElement('div');
                const isMine = msg.sender === userID;
                div.className = `message ${isMine ? 'outgoing' : 'incoming'}`;
                
                let senderHTML = '';
                if (isGroup && !isMine) {
                    const senderName = msg.sender === 'VOX-BOT' ? 'Бот' : (usersDB[msg.sender]?.name || 'Юзер');
                    senderHTML = `<span class="sender-name">${senderName}</span>`;
                }

                let replyHTML = msg.reply ? `<div class="reply-quote">${msg.reply}</div>` : '';
                
                // ЛОГИКА ГАЛОЧЕК (Прочитано, только если собеседник онлайн)
                let checkmark = '';
                if (isMine) {
                    if (currentChatStatus === 'online' && !isGroup && currentChatID !== 'VOX-BOT') {
                        checkmark = '<span class="checkmark read">✓✓</span>';
                    } else {
                        checkmark = '<span class="checkmark">✓✓</span>';
                    }
                }
                
                if (msg.type === 'voice') {
                    div.innerHTML = `${senderHTML}<div class="msg-bubble"><audio controls src="${msg.text}"></audio><div class="msg-time">${msg.time} ${checkmark}</div></div>`;
                } else if (msg.type === 'image') {
                    div.innerHTML = `${senderHTML}<div class="msg-bubble"><img src="${msg.text}"><div class="msg-time" style="background:rgba(0,0,0,0.4); border-radius:10px; padding:2px 6px; right:5px; bottom:5px;">${msg.time} ${checkmark}</div></div>`;
                } else {
                    div.innerHTML = `${senderHTML}${replyHTML}<div class="msg-bubble">${msg.text}<span class="msg-time">${msg.time} ${checkmark}</span></div>`;
                }

                div.addEventListener('contextmenu', (e) => { e.preventDefault(); showCtxMenu(e.clientX, e.clientY, msg.key, msg); });
                
                let touchTimer;
                div.addEventListener('touchstart', (e) => {
                    touchTimer = setTimeout(() => {
                        const touch = e.touches[0];
                        showCtxMenu(touch.clientX, touch.clientY, msg.key, msg);
                    }, 500);
                });
                div.addEventListener('touchend', () => clearTimeout(touchTimer));
                div.addEventListener('touchmove', () => clearTimeout(touchTimer));

                div.ondblclick = () => {
                    const chatID = [userID, currentChatID].sort().join('_');
                    update(ref(db, `messages/${chatID}/${msg.key}`), { reaction: '❤️' });
                };

                if(msg.reaction) div.innerHTML += `<div class="reaction">${msg.reaction}</div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        // --- ФУНКЦИЯ ПЕЧАТИ ---
        window.handleTyping = function() {
            if (!currentChatID || currentChatID === 'VOX-BOT') return;
            const typingRef = ref(db, 'typing/' + userID + '/' + currentChatID);
            set(typingRef, 'typing');
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                set(typingRef, 'idle');
            }, 2000);
        };

        // --- ПОИСК ПО СООБЩЕНИЯМ ---
        window.openSearchMessages = function() {
            if (!currentChatID) return alert('Выберите чат!');
            document.getElementById('searchMsgInput').value = '';
            document.getElementById('searchMsgResults').innerHTML = '';
            openModal('search-messages-modal');
        };

        window.doSearchMessages = function() {
            const query = document.getElementById('searchMsgInput').value.toLowerCase();
            const results = document.getElementById('searchMsgResults');
            results.innerHTML = '';
            if (!query || !currentChatID) return;
            
            const msgs = chatData[currentChatID]?.messages || {};
            Object.values(msgs).forEach(msg => {
                if (msg.text && msg.text.toLowerCase().includes(query)) {
                    const div = document.createElement('div');
                    div.style.padding = '10px';
                    div.style.borderBottom = '1px solid var(--border-color)';
                    div.style.fontSize = '13px';
                    div.innerText = msg.text;
                    results.appendChild(div);
                }
            });
            if (results.innerHTML === '') results.innerHTML = '<div style="color:var(--text-muted); font-size:13px;">Ничего не найдено</div>';
        };

        function showCtxMenu(x, y, key, msgData) {
            ctxMsgKey = key;
            ctxMsgData = msgData;
            const menu = document.getElementById('ctxMenu');
            
            document.getElementById('ctxEditBtn').style.display = (msgData.sender === userID && msgData.type === 'text') ? 'block' : 'none';
            
            menu.style.left = Math.min(x, window.innerWidth - 160) + 'px';
            menu.style.top = Math.min(y, window.innerHeight - 200) + 'px';
            menu.style.display = 'flex';
        }
        document.addEventListener('click', () => { document.getElementById('ctxMenu').style.display = 'none'; });

        window.ctxReply = function() {
            replyTo = ctxMsgData.text;
            document.getElementById('msgInput').placeholder = `Ответ: ${replyTo.substring(0, 15)}...`;
            document.getElementById('msgInput').focus();
            document.getElementById('ctxMenu').style.display = 'none';
        };

        window.ctxReact = function() {
            const chatID = [userID, currentChatID].sort().join('_');
            update(ref(db, `messages/${chatID}/${ctxMsgKey}`), { reaction: '❤️' });
            document.getElementById('ctxMenu').style.display = 'none';
        };

        window.ctxEdit = function() {
            if (ctxMsgData.sender !== userID || ctxMsgData.type !== 'text') return alert('Нельзя редактировать!');
            document.getElementById('editMsgInput').value = ctxMsgData.text;
            openModal('edit-message-modal');
            document.getElementById('ctxMenu').style.display = 'none';
        };

        window.saveEditedMessage = function() {
            const newText = document.getElementById('editMsgInput').value.trim();
            if (!newText) return alert('Сообщение не может быть пустым!');
            const chatID = [userID, currentChatID].sort().join('_');
            update(ref(db, `messages/${chatID}/${ctxMsgKey}`), { text: newText, edited: true });
            closeModal('edit-message-modal');
        };

        window.ctxDelete = function() {
            if (ctxMsgData.sender !== userID) return alert('Нельзя удалить чужое!');
            if (confirm('Удалить сообщение?')) {
                const chatID = [userID, currentChatID].sort().join('_');
                remove(ref(db, `messages/${chatID}/${ctxMsgKey}`));
            }
            document.getElementById('ctxMenu').style.display = 'none';
        };

        window.togglePanel = function(id) {
            document.querySelectorAll('.panel').forEach(p => {
                if(p.id !== id) p.classList.remove('active');
            });
            document.getElementById(id).classList.toggle('active');
        };

        window.addEmoji = function(emoji) {
            const input = document.getElementById('msgInput');
            input.value += emoji;
            input.focus();
        };

        window.sendSticker = function(src) {
            if (!currentChatID) return;
            const chatID = [userID, currentChatID].sort().join('_');
            push(ref(db, 'messages/' + chatID), {
                sender: userID,
                text: src,
                type: 'image',
                time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            });
            document.getElementById('stickerPanel').classList.remove('active');
        };

        window.sendMessage = async function() {
            if (!currentChatID || isSending) return;
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            const isGroup = groupsDB[currentChatID] !== undefined;
            if (isGroup && groupsDB[currentChatID].type === 'channel' && groupsDB[currentChatID].creator !== userID) {
                return alert('В этом канале писать может только создатель!');
            }
            
            isSending = true;
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.style.opacity = '0.5';

            const chatID = [userID, currentChatID].sort().join('_');
            const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

            // ФИКС БАГА: не отправляем пустой reply
            const msgData = {
                sender: userID,
                text: text,
                time: time,
                timestamp: Date.now(),
                type: 'text'
            };
            if (replyTo) msgData.reply = replyTo;

            try {
                await push(ref(db, 'messages/' + chatID), msgData);
                input.value = '';
                replyTo = null;
                input.placeholder = "Сообщение...";
                // Сбрасываем статус печати
                if (currentChatID !== 'VOX-BOT') set(ref(db, 'typing/' + userID + '/' + currentChatID), 'idle');
            } catch (e) {
                alert('Ошибка отправки: ' + e.message);
            } finally {
                isSending = false;
                sendBtn.style.opacity = '1';
            }

            if (currentChatID === 'VOX-BOT') {
                setTimeout(async () => {
                    let reply = "";
                    const lower = text.toLowerCase();
                    if (lower.includes('/help')) reply = "Команды бота: привет, как дела, кс";
                    else if (lower.includes('привет')) reply = "Привет, я Vox Бот! Чем могу помочь?";
                    else if (lower.includes('дела')) reply = "У меня всё отлично, работаю 24/7.";
                    else if (lower.includes('кс') || lower.includes('cs')) reply = "В CS2? Я бы сыграл, но у меня руки из кода.";
                    else reply = "Я тебя понял. Но я всего лишь бот.";
                    
                    await push(ref(db, 'messages/' + [userID, 'VOX-BOT'].sort().join('_')), {
                        sender: 'VOX-BOT',
                        text: reply,
                        time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                        timestamp: Date.now(),
                        type: 'text'
                    });
                }, 1500);
            }
        };

        window.handleKeyPress = function(event) { if (event.key === 'Enter') sendMessage(); };

        window.searchFriend = async function() {
            const queryID = document.getElementById('friendSearchInput').value.trim().toUpperCase();
            const resultEl = document.getElementById('searchResult');
            if (!queryID) return;
            
            const myData = usersDB[userID] || {};
            if (queryID === myData.voxId) return resultEl.innerText = 'Это ваш ID!';

            if (queryID === 'VOX-BOT') return resultEl.innerHTML = `Найден: <b>Vox Бот</b><br><button onclick="addFriendToChat('VOX-BOT')" style="margin-top:10px; padding:8px 15px; background:#10b981; border:none; border-radius:8px; color:white; cursor:pointer; font-weight:bold;">Написать</button>`;

            let foundUid = null;
            for (const [uid, data] of Object.entries(usersDB)) {
                if (data.voxId === queryID) {
                    foundUid = uid;
                    break;
                }
            }

            if (foundUid) {
                const friendName = usersDB[foundUid].name;
                resultEl.innerHTML = `Найден: <b>${friendName}</b><br><button onclick="addFriendToChat('${foundUid}')" style="margin-top:10px; padding:8px 15px; background:#10b981; border:none; border-radius:8px; color:white; cursor:pointer; font-weight:bold;">Написать</button>`;
            } else {
                resultEl.innerText = 'Пользователь не найден.';
                resultEl.style.color = 'var(--danger)';
            }
        };

        window.addFriendToChat = async function(friendID) {
            await set(ref(db, `user_chats/${userID}/${friendID}`), true);
            closeModal('add-friend-modal');
            const friendName = friendID === 'VOX-BOT' ? 'Vox Бот' : (usersDB[friendID]?.name || 'Друг');
            openChat(friendID, friendName, false);
        };

        window.openImagePicker = function() { document.getElementById('imageInput').click(); };
        window.sendImage = function(event) {
            const file = event.target.files[0];
            if (!file || !currentChatID) return;
            if (file.size > 500000) return alert('Файл слишком большой (макс. 500KB)');
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                const chatID = [userID, currentChatID].sort().join('_');
                await push(ref(db, 'messages/' + chatID), {
                    sender: userID,
                    text: e.target.result,
                    type: 'image',
                    time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                    timestamp: Date.now()
                });
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        };

        window.startVoiceRecord = async function() {
            if (isRecording) { stopVoiceRecord(); return; }
            if (!currentChatID) return alert('Выберите чат!');
            
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
                mediaRecorder = new MediaRecorder(currentStream, { mimeType: mimeType });
                
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: mimeType });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        const chatID = [userID, currentChatID].sort().join('_');
                        await push(ref(db, 'messages/' + chatID), {
                            sender: userID,
                            text: reader.result,
                            type: 'voice',
                            time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }),
                            timestamp: Date.now()
                        });
                    };
                };

                mediaRecorder.start();
                isRecording = true;
                document.getElementById('voiceBtn').style.color = 'var(--danger)';
                document.getElementById('voiceBtn').innerText = '⏹️';
                
                setTimeout(() => { if (isRecording) stopVoiceRecord(); }, 15000);

            } catch (err) {
                alert("Ошибка микрофона: " + err.message);
            }
        };

        function stopVoiceRecord() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                    currentStream = null;
                }
                isRecording = false;
                document.getElementById('voiceBtn').style.color = 'var(--text-muted)';
                document.getElementById('voiceBtn').innerText = '🎙️';
            }
        }

        window.openModal = function(id) { document.getElementById(id).classList.add('active'); };
        window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };
        
        window.changeTheme = function(theme) {
            document.body.className = '';
            if (theme === 'light') document.body.classList.add('light-theme');
            localStorage.setItem('voxTheme', theme);
        };
        window.changeFontSize = function(size) {
            document.body.style.fontSize = size;
            localStorage.setItem('voxFontSize', size);
        };
        window.uploadWallpaper = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.documentElement.style.setProperty('--chat-wallpaper', `url(${ev.target.result})`);
                localStorage.setItem('voxWallpaper', `url(${ev.target.result})`);
            };
            reader.readAsDataURL(file);
        };
        window.changeWallpaper = function(wp, el) {
            document.documentElement.style.setProperty('--chat-wallpaper', wp === 'none' ? 'none' : wp);
            localStorage.setItem('voxWallpaper', wp);
        };
        
        window.copyMyId = function() { 
            const myData = usersDB[userID] || {};
            if (myData.voxId) {
                navigator.clipboard.writeText(myData.voxId); 
                showNotification('ID', 'Скопирован!');
            }
        };
        
        window.showNotification = function(title, text) {
            const container = document.getElementById('notification-container');
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.innerHTML = `<div>💬</div><div><b>${title}</b><br>${text}</div>`;
            container.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        };

        window.openEditProfile = function() {
            document.getElementById('editNameInput').value = currentUser;
            const myData = usersDB[userID] || {};
            document.getElementById('editStatusInput').value = myData.status || '';
            document.getElementById('edit-profile-modal').classList.add('active');
        };

        window.saveProfile = async function() {
            const newName = document.getElementById('editNameInput').value.trim();
            const newStatus = document.getElementById('editStatusInput').value.trim();
            if (newName.length < 2) return alert('Слишком коротко!');
            
            await update(ref(db, 'users/' + userID), {
                name: newName,
                status: newStatus,
                avatar: tempAvatarBase64 || (usersDB[userID] || {}).avatar
            });
            
            updateProfileUI();
            closeModal('edit-profile-modal');
        };

        window.openLogoutModal = function() { document.getElementById('logout-modal').classList.add('active'); };
        window.confirmLogout = async function() {
            await signOut(auth);
            localStorage.clear();
            location.reload();
        };

        window.openProfileModal = function() {};
        window.filterChats = function() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.chat-item').forEach(item => {
                const name = item.querySelector('.chat-name').innerText.toLowerCase();
                item.style.display = name.includes(query) ? 'flex' : 'none';
            });
        };

        window.addEventListener('load', () => {
            if (localStorage.getItem('voxTheme')) changeTheme(localStorage.getItem('voxTheme'));
            if (localStorage.getItem('voxFontSize')) changeFontSize(localStorage.getItem('voxFontSize'));
            if (localStorage.getItem('voxWallpaper')) document.documentElement.style.setProperty('--chat-wallpaper', localStorage.getItem('voxWallpaper'));
        });
    </script>
</body>
</html>
