<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VOX NEO</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#101116">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --bg-color: #101116;
            --bg-secondary: #151821;
            --bg-card: #1B1F29;
            --bg-hover: #242A37;
            --border-color: #2A3040;
            --text-main: #F4F6FC;
            --text-muted: #9299AA;
            --accent-blue: #398BFF;
            --accent-purple: #895CFF;
            --msg-in: #1B1F29;
            --msg-out: linear-gradient(135deg, #398BFF, #895CFF);
            --danger: #ef4444;
            --online: #10b981;
        }

        body.light-theme { --bg-color: #f8fafc; --bg-secondary: #ffffff; --bg-card: #f1f5f9; --bg-hover: #e2e8f0; --border-color: #cbd5e1; --text-main: #0f172a; --text-muted: #64748b; --msg-in: #ffffff; --msg-out: linear-gradient(135deg, #398BFF, #895CFF); }
        body.cyberpunk-theme { --bg-color: #050505; --bg-secondary: #0d0221; --bg-card: #1a0033; --bg-hover: #2a0055; --border-color: #ff00ff; --text-main: #00ffff; --text-muted: #ff00ff; --msg-in: #1a0033; --msg-out: linear-gradient(135deg, #330066, #660099); }
        body.pink-theme { --bg-color: #fdf2f8; --bg-secondary: #ffffff; --bg-card: #fce7f3; --bg-hover: #fbcfe8; --border-color: #f9a8d4; --text-main: #831843; --text-muted: #db2777; --msg-in: #ffffff; --msg-out: linear-gradient(135deg, #f472b6, #ec4899); }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent;}
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-size: 14px; }

        #auth-screen { position: fixed; inset: 0; background: var(--bg-color); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .auth-box { background: var(--bg-card); padding: 40px 30px; border-radius: 24px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .auth-box h1 { font-size: 36px; color: var(--accent-blue); margin-bottom: 10px; letter-spacing: 2px;}
        .auth-box p { color: var(--text-muted); margin-bottom: 20px; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 15px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-main); font-size: 16px; margin-bottom: 15px; outline: none; text-align: center; transition: 0.2s; }
        input:focus { border-color: var(--accent-blue); }
        .auth-box button { width: 100%; padding: 15px; background: var(--accent-blue); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .auth-box button:hover { background: var(--accent-purple); }
        .auth-toggle { font-size: 13px; color: var(--text-muted); cursor: pointer; text-decoration: underline; margin-top: 15px;}
        .auth-error { color: var(--danger); font-size: 13px; margin-top: 5px; margin-bottom: 10px; min-height: 18px; font-weight: 500;}

        .vox-container { width: 100%; height: 100%; max-width: 1400px; max-height: 900px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 24px; display: flex; overflow: hidden; position: relative; display: none; }
        .sidebar { width: 380px; border-right: 1px solid var(--border-color); background: var(--bg-color); display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); }
        .user-profile { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border-color); display: flex; justify-content: center; align-items: center; font-weight: bold; overflow: hidden; position: relative; cursor: pointer; color: var(--text-main); }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .status-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg-color); background: var(--online); }
        .user-info { display: flex; flex-direction: column; cursor: pointer; flex: 1; }
        .user-name { font-weight: 600; font-size: 16px; }
        .user-id { font-size: 12px; color: var(--accent-blue); }
        .settings-btn, .add-friend-btn { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
        .add-friend-btn { color: var(--accent-blue); }
        
        .chat-tabs { display: flex; gap: 8px; padding: 10px 20px; overflow-x: auto; border-bottom: 1px solid var(--border-color); }
        .chat-tab { padding: 8px 16px; background: var(--bg-card); border-radius: 20px; color: var(--text-muted); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .chat-tab.active { background: var(--accent-blue); color: white; }
        
        .search-bar { padding: 10px 20px; }
        .search-bar input { width: 100%; padding: 10px 15px; background: var(--bg-card); border: none; border-radius: 10px; color: var(--text-main); font-size: 14px; outline: none; }
       
        .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item { display: flex; align-items: center; padding: 12px 15px; border-radius: 16px; cursor: pointer; margin-bottom: 5px; transition: 0.2s; }
        .chat-item:hover { background: var(--bg-card); }
        .chat-item.active { background: rgba(57, 139, 255, 0.1); border-left: 3px solid var(--accent-blue); }
        .avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--bg-card); display: flex; justify-content: center; align-items: center; font-weight: bold; margin-right: 15px; flex-shrink: 0; overflow: hidden; color: white; font-size: 20px; position: relative; border: 1px solid var(--border-color); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
        .chat-last-msg { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); position: relative; }
        .chat-header { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; background: var(--bg-secondary); min-height: 70px; cursor: pointer; z-index: 10; }
        .back-btn { display: none; background: none; border: none; color: var(--accent-blue); font-size: 26px; cursor: pointer; margin-right: 10px; }
        .chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; background: var(--bg-card); color: white; font-weight: bold; }
        .chat-header-avatar img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .chat-header-info { font-size: 16px; font-weight: 600; }
        .chat-header-status { font-size: 12px; color: var(--accent-blue); }

        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .message { max-width: 75%; display: flex; flex-direction: column; position: relative; animation: popIn 0.2s; }
        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.incoming { align-self: flex-start; }
        .message.outgoing { align-self: flex-end; align-items: flex-end; }
       
        .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; padding-bottom: 22px; }
        .message.incoming .msg-bubble { background: var(--msg-in); border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }
        .message.outgoing .msg-bubble { background: var(--msg-out); color: white; border-bottom-right-radius: 4px; }
       
        .message.image .msg-bubble { background: transparent; padding: 0; border: none; }
        .message.image img { max-width: 260px; max-height: 350px; width: auto; height: auto; border-radius: 12px; object-fit: cover; display: block; }
        
        .msg-time { position: absolute; right: 8px; bottom: 4px; font-size: 10px; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 3px;}
        .message.incoming .msg-time { color: var(--text-muted); }

        .input-area { padding: 10px 15px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; background: var(--bg-secondary); align-items: center; padding-bottom: max(10px, env(safe-area-inset-bottom)); z-index: 10; }
        .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .icon-btn:hover { color: var(--accent-blue); }
        .input-area input { flex: 1; padding: 12px 18px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 25px; color: var(--text-main); outline: none; font-size: 15px; }
        .input-area input:focus { border-color: var(--accent-blue); }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-blue); border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .send-btn:hover { background: var(--accent-purple); }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 4000; justify-content: center; align-items: center; padding: 20px;}
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--bg-card); padding: 25px; border-radius: 20px; text-align: center; width: 100%; max-width: 360px; border: 1px solid var(--border-color); }
        .modal-card h2 { margin-bottom: 20px; font-size: 20px; }
        .modal-card input { background: var(--bg-color); border: 1px solid var(--accent-blue); margin-bottom: 15px; }
        
        .action-btn { padding: 14px 20px; border-radius: 12px; border: none; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; min-height: 48px; display: flex; align-items: center; justify-content: center; width: 100%; margin-bottom: 10px; }
        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-secondary { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); }

        .ctx-menu, .chat-action-menu { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 5000; display: none; justify-content: center; align-items: flex-end; padding-bottom: 20px; }
        .ctx-menu.active, .chat-action-menu.active { display: flex; }
        .menu-content { background: var(--bg-card); width: 100%; max-width: 400px; border-radius: 20px; padding: 10px; border: 1px solid var(--border-color); }
        .menu-btn { padding: 15px; width: 100%; text-align: left; background: none; border: none; border-radius: 12px; color: var(--text-main); font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 15px; }
        .menu-btn:hover { background: var(--bg-hover); }
        .menu-btn.danger { color: var(--danger); }

        @media (max-width: 768px) {
            .vox-container { border-radius: 0; border: none; max-height: 100%; }
            .sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; position: absolute; z-index: 5; height: 100%; transform: translateX(100%); transition: transform 0.3s; }
            .chat-area.active { transform: translateX(0); }
            .back-btn { display: flex; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h1>VOX</h1>
            <p id="auth-subtitle">Вход в аккаунт</p>
            <div class="auth-avatar-container" id="avatar-upload-block" onclick="document.getElementById('authAvatarInput').click()" style="display:none; width: 80px; height: 80px; margin: 0 auto 15px; border-radius: 50%; background: var(--bg-secondary); border: 2px solid var(--accent-blue); overflow: hidden; cursor: pointer;">
                <img id="authAvatarImg" src="" style="width:100%; height:100%; object-fit:cover; display:none;">
                <span id="authAvatarText" style="font-size: 24px; line-height: 76px; color: var(--text-muted);">📷</span>
            </div>
            <input type="file" id="authAvatarInput" accept="image/*" style="display: none;" onchange="processAvatar(event, 'auth')">
            <input type="email" id="authEmailInput" placeholder="Ваш Email">
            <input type="password" id="authPasswordInput" placeholder="Пароль">
            <div id="authError" class="auth-error"></div>
            <button onclick="handleAuth()">ВОЙТИ</button>
            <div class="auth-toggle" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</div>
        </div>
    </div>

    <div class="modal-overlay" id="view-profile-modal" onclick="overlayClick(event, 'view-profile-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 id="viewProfileName">Собеседник</h2>
            <p id="viewProfileStatus" style="color: var(--text-muted); margin-bottom: 15px;">был(а) недавно</p>
            <div style="background: var(--bg-color); padding: 10px; border-radius: 10px; margin-bottom: 15px;">
                <span style="color: var(--text-muted); font-size: 13px;">VOX TAG:</span> <br>
                <strong id="viewProfileId" style="color: var(--accent-blue); font-size: 16px;">VOX-0000</strong>
            </div>
            <button class="action-btn btn-secondary" onclick="closeModal('view-profile-modal')">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay" id="edit-profile-modal" onclick="overlayClick(event, 'edit-profile-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2>Мой профиль</h2>
            <input type="text" id="editNameInput" placeholder="Новый никнейм" maxlength="15">
            <input type="text" id="editStatusInput" placeholder="Статус (о себе)" maxlength="30">
            <button class="action-btn btn-primary" onclick="saveProfile()">Сохранить</button>
            <button class="action-btn btn-secondary" onclick="closeModal('edit-profile-modal')">Отмена</button>
        </div>
    </div>

    <div class="modal-overlay" id="add-friend-modal" onclick="overlayClick(event, 'add-friend-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2>Добавить</h2>
            <input type="text" id="friendSearchInput" placeholder="Введите VOX TAG друга">
            <div id="searchResult" style="margin-bottom:20px; color: var(--accent-blue); font-size:14px;"></div>
            <button class="action-btn btn-primary" onclick="searchFriend()">Найти по VOX TAG</button>
            <button class="action-btn btn-secondary" onclick="closeModal('add-friend-modal')">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay" id="settings-modal" onclick="overlayClick(event, 'settings-modal')">
        <div class="modal-card" onclick="event.stopPropagation()" style="max-width: 400px;">
            <h2>Настройки</h2>
            <div style="background: var(--bg-color); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                <p style="color:var(--text-muted); font-size: 13px; margin-bottom:5px;">Ваш VOX TAG:</p>
                <div id="myIdDisplay" onclick="copyMyId()" style="font-size: 18px; font-weight: 700; color: var(--accent-blue); cursor: pointer;">VOX-0000</div>
            </div>
            
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button class="action-btn btn-secondary" onclick="changeTheme('default')" style="flex:1;">Тёмная</button>
                <button class="action-btn btn-secondary" onclick="changeTheme('light')" style="flex:1;">Светлая</button>
            </div>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button class="action-btn btn-secondary" onclick="changeTheme('cyberpunk')" style="flex:1;">Кибер</button>
                <button class="action-btn btn-secondary" onclick="changeTheme('pink')" style="flex:1;">Розовая</button>
            </div>

            <button class="action-btn btn-secondary" onclick="openLogoutModal()" style="color:var(--danger); border-color:var(--danger);">Выйти из аккаунта</button>
            <button class="action-btn btn-primary" onclick="closeModal('settings-modal')">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay" id="logout-modal" onclick="overlayClick(event, 'logout-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h2 style="color:var(--danger);">Выход</h2>
            <button class="action-btn btn-primary" onclick="confirmLogout()" style="background:var(--danger); margin-top: 15px;">Выйти</button>
            <button class="action-btn btn-secondary" onclick="closeModal('logout-modal')">Отмена</button>
        </div>
    </div>

    <div class="ctx-menu" id="ctxMenu" onclick="closeCtxMenu(event)">
        <div class="menu-content" onclick="event.stopPropagation()">
            <button class="menu-btn" onclick="ctxReply()">↩️ Ответить</button>
            <button class="menu-btn" onclick="ctxForward()">➡️ Переслать</button>
            <button class="menu-btn danger" onclick="ctxDelete()">🗑️ Удалить</button>
            <button class="menu-btn" onclick="closeCtxMenu()" style="justify-content: center; color: var(--text-muted);">Отмена</button>
        </div>
    </div>

    <div class="chat-action-menu" id="chatActionMenu" onclick="closeChatActionMenu(event)">
        <div class="menu-content" onclick="event.stopPropagation()">
            <button class="menu-btn" onclick="actionTogglePin()" id="actionPinBtn">📌 Закрепить</button>
            <button class="menu-btn danger" onclick="actionDeleteChat()">🗑️ Удалить чат</button>
            <button class="menu-btn" onclick="closeChatActionMenu()" style="justify-content: center; color: var(--text-muted);">Отмена</button>
        </div>
    </div>

    <div class="vox-container" id="mainApp">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="user-profile">
                    <div class="user-avatar" id="myAvatarContainer" onclick="openEditProfile()">
                        <img id="myAvatarImg" src="" alt="Avatar">
                        <span id="myAvatarText">?</span>
                        <div class="status-dot"></div>
                    </div>
                    <div class="user-info" onclick="openEditProfile()">
                        <div class="user-name" id="myName">Гость</div>
                        <div class="user-id" id="myID">VOX-...</div>
                    </div>
                    <button class="settings-btn" onclick="openModal('settings-modal')">⚙️</button>
                    <button class="add-friend-btn" onclick="openModal('add-friend-modal')">➕</button>
                </div>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Поиск чатов..." oninput="filterChats()">
                </div>
            </div>
            <div class="chat-tabs">
                <div class="chat-tab active" onclick="switchTab(this)">Все</div>
                <div class="chat-tab" onclick="switchTab(this)">Личные</div>
                <div class="chat-tab" onclick="switchTab(this)">Группы</div>
            </div>
            <div class="chat-list" id="chatList"></div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="chat-header" onclick="openProfileModal()">
                <button class="back-btn" onclick="event.stopPropagation(); closeChat()">←</button>
                <div class="chat-header-avatar" id="headerAvatarContainer">
                    <img id="headerAvatarImg" src="" alt="Avatar">
                    <span id="headerAvatarText">?</span>
                </div>
                <div style="display:flex; flex-direction:column; flex:1;">
                    <div class="chat-header-info" id="headerName">Выберите чат</div>
                    <div class="chat-header-status" id="typingStatus"></div>
                </div>
            </div>

            <div class="messages" id="messagesContainer">
                 <div style="text-align:center; color:var(--text-muted); margin-top:50px;">Выберите чат</div>
            </div>
           
            <div class="input-area">
                <button class="icon-btn" onclick="openImagePicker()">📷</button>
                <button class="icon-btn" onclick="startVoiceRecord()" id="voiceBtn">🎙️</button>
                <input type="text" id="msgInput" placeholder="Сообщение" onkeypress="handleKeyPress(event)" oninput="handleTyping()">
                <button class="send-btn" id="sendBtn" onclick="sendMessage()"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="white" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
            </div>
        </div>
    </div>

    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage(event)">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, get, update, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCfoqJjADzqTjt6Fm5TscvJexQVlZeHloQ",
            authDomain: "vox-messenger-41233.firebaseapp.com",
            databaseURL: "https://vox-messenger-41233-default-rtdb.firebaseio.com",
            projectId: "vox-messenger-41233",
            storageBucket: "vox-messenger-41233.firebasestorage.app",
            messagingSenderId: "391369283601",
            appId: "1:391369283601:web:28ec1b0b0c0763e2bab9b0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let currentUser = null;
        let userID = null;
        let isRegisterMode = false;
        let chatData = {};
        let usersDB = {};
        let currentChatID = null;
        let isSending = false;
        let tempAvatarBase64 = null;
        
        let ctxMsgKey = null;
        let ctxMsgData = null;
        let actionTargetChatID = null;
        let isRecording = false;
        let mediaRecorder;
        let audioChunks = [];

        window.toggleAuthMode = function() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-subtitle').innerText = isRegisterMode ? 'Регистрация' : 'Вход';
            document.querySelector('.auth-box button').innerText = isRegisterMode ? 'СОЗДАТЬ АККАУНТ' : 'ВОЙТИ';
            document.querySelector('.auth-toggle').innerText = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
            document.getElementById('avatar-upload-block').style.display = isRegisterMode ? 'block' : 'none';
            document.getElementById('authError').innerText = '';
        };

        window.handleAuth = async function() {
            const email = document.getElementById('authEmailInput').value.trim();
            const password = document.getElementById('authPasswordInput').value;
            const errorEl = document.getElementById('authError');
            errorEl.innerText = '';

            if (!email || !password) return errorEl.innerText = 'Заполните Email и пароль!';
            if (password.length < 6) return errorEl.innerText = 'Пароль минимум 6 символов!';

            try {
                if (isRegisterMode) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const newUid = userCredential.user.uid;
                    const voxId = 'VOX-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                    await set(ref(db, 'users/' + newUid), {
                        name: email.split('@')[0], voxId: voxId, avatar: tempAvatarBase64 || "", status: 'В сети VOX'
                    });
                    await sendEmailVerification(userCredential.user);
                    isRegisterMode = false;
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                if (error.code === 'auth/wrong-password') errorEl.innerText = 'Неверный пароль.';
                else if (error.code === 'auth/user-not-found') errorEl.innerText = 'Аккаунт не найден.';
                else if (error.code === 'auth/email-already-in-use') errorEl.innerText = 'Email уже занят.';
                else errorEl.innerText = 'Ошибка: ' + error.message;
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                userID = user.uid;
                const profileSnap = await get(ref(db, 'users/' + userID));
                if (!profileSnap.exists()) { setTimeout(() => initApp(), 1000); return; }
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                initApp();
            } else {
                userID = null;
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('authPasswordInput').value = '';
            }
        });

        window.processAvatar = function(event, context) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 100; canvas.height = 100;
                    canvas.getContext('2d').drawImage(img, 0, 0, 100, 100);
                    tempAvatarBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    if (context === 'auth') {
                        document.getElementById('authAvatarImg').src = tempAvatarBase64;
                        document.getElementById('authAvatarImg').style.display = 'block';
                        document.getElementById('authAvatarText').style.display = 'none';
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        async function initApp() {
            onValue(ref(db, 'users'), (snapshot) => {
                usersDB = snapshot.val() || {};
                updateProfileUI();
                renderChatList();
            });

            onValue(ref(db, 'user_chats/' + userID), (snapshot) => {
                chatData = snapshot.val() || {};
                if (!chatData['FAVORITES']) set(ref(db, `user_chats/${userID}/FAVORITES`), true);
                renderChatList();
            });
            
            const botCheck = await get(ref(db, 'user_chats/' + userID + '/VOX-BOT'));
            if (!botCheck.exists()) set(ref(db, `user_chats/${userID}/VOX-BOT`), true);
        }

        window.updateProfileUI = function() {
            const myData = usersDB[userID] || {};
            currentUser = myData.name || 'Гость';
            document.getElementById('myName').innerText = currentUser;
            document.getElementById('myID').innerText = myData.voxId || 'VOX-...';
            document.getElementById('myIdDisplay').innerText = myData.voxId || 'VOX-...';
            if (myData.avatar) {
                document.getElementById('myAvatarImg').src = myData.avatar;
                document.getElementById('myAvatarImg').style.display = 'block';
                document.getElementById('myAvatarText').style.display = 'none';
            } else {
                document.getElementById('myAvatarText').innerText = currentUser[0].toUpperCase();
            }
        };

        window.switchTab = function(el) {
            document.querySelectorAll('.chat-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderChatList(el.innerText);
        };

        function renderChatList(filter = 'Все') {
            const container = document.getElementById('chatList');
            container.innerHTML = '';
            let chatsToRender = Object.keys(chatData).sort((a, b) => a === 'FAVORITES' ? -1 : (b === 'FAVORITES' ? 1 : 0));

            chatsToRender.forEach(friendID => {
                const isGroup = groupsDB[friendID] !== undefined;
                if (filter === 'Личные' && isGroup) return;
                if (filter === 'Группы' && !isGroup) return;

                let friendName = friendID === 'FAVORITES' ? 'Избранное' : (friendID === 'VOX-BOT' ? 'Vox Бот' : (isGroup ? groupsDB[friendID].name : (usersDB[friendID]?.name || 'Юзер')));
                let avatarTxt = friendID === 'FAVORITES' ? '★' : friendName[0].toUpperCase();
                
                const div = document.createElement('div');
                div.className = 'chat-item' + (friendID === currentChatID ? ' active' : '');
                div.onclick = () => openChat(friendID, friendName, isGroup);
                
                let pressTimer;
                div.addEventListener('touchstart', () => { pressTimer = setTimeout(() => openChatActionMenu(friendID, friendName), 600); });
                div.addEventListener('touchend', () => clearTimeout(pressTimer));
                div.addEventListener('touchmove', () => clearTimeout(pressTimer));

                div.innerHTML = `
                    <div class="avatar">${avatarTxt}</div>
                    <div class="chat-info">
                        <div class="chat-name">${friendName}</div>
                        <div class="chat-last-msg">Нажмите чтобы открыть</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.openChatActionMenu = function(id, name) {
            if (id === 'FAVORITES') return;
            actionTargetChatID = id;
            document.getElementById('chatActionMenu').classList.add('active');
        };
        window.closeChatActionMenu = function(e) {
            if (!e || e.target.id === 'chatActionMenu' || e.type === 'click') document.getElementById('chatActionMenu').classList.remove('active');
        };
        window.actionDeleteChat = function() {
            remove(ref(db, `user_chats/${userID}/${actionTargetChatID}`));
            closeChatActionMenu();
        };

        window.openChat = function(friendID, friendName, isGroup) {
            currentChatID = friendID;
            document.getElementById('headerName').innerText = friendName;
            document.getElementById('headerAvatarText').innerText = friendName[0].toUpperCase();
            document.getElementById('sidebar').classList.add('hidden');
            document.getElementById('chatArea').classList.add('active');
            renderChatList();

            // ЧЕРНОВИКИ: Загружаем текст при открытии
            const draftKey = `vox_draft_${[userID, friendID].sort().join('_')}`;
            const savedDraft = localStorage.getItem(draftKey);
            const msgInput = document.getElementById('msgInput');
            if (savedDraft) { msgInput.value = savedDraft; } else { msgInput.value = ''; }

            let chatID = friendID === 'FAVORITES' ? userID + '_FAVORITES' : [userID, friendID].sort().join('_');
            
            onValue(ref(db, 'messages/' + chatID), (snapshot) => {
                renderMessages(snapshot.val() || {});
                // СТАТУС ПРОЧИТАНО: Отмечаем как прочитанное
                if (friendID !== 'FAVORITES' && friendID !== 'VOX-BOT') {
                    set(ref(db, 'read_status/' + chatID + '/' + userID), true);
                }
            });
        };

        window.closeChat = function() {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('chatArea').classList.remove('active');
            
            // ЧЕРНОВИКИ: Сохраняем текст при закрытии
            const msgInput = document.getElementById('msgInput');
            if (currentChatID) {
                const draftKey = `vox_draft_${[userID, currentChatID].sort().join('_')}`;
                if (msgInput.value.trim()) {
                    localStorage.setItem(draftKey, msgInput.value);
                } else {
                    localStorage.removeItem(draftKey);
                }
            }
            currentChatID = null;
        };

        // ЧЕРНОВИКИ: Сохраняем при вводе
        document.getElementById('msgInput').addEventListener('input', function() {
            if (currentChatID) {
                const draftKey = `vox_draft_${[userID, currentChatID].sort().join('_')}`;
                if (this.value.trim()) localStorage.setItem(draftKey, this.value);
                else localStorage.removeItem(draftKey);
            }
        });

        function renderMessages(msgsObj) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            const msgs = Object.keys(msgsObj).map(key => ({ key, ...msgsObj[key] })).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
            
            msgs.forEach(msg => {
                const div = document.createElement('div');
                const isMine = msg.sender === userID;
                div.className = `message ${isMine ? 'outgoing' : 'incoming'}`;
                
                let checkmark = isMine ? '<span style="color: #60a5fa; font-size:10px;">✓✓</span>' : '';
                let content = '';

                if (msg.type === 'image') {
                    div.classList.add('image');
                    content = `<img src="${msg.text}">`;
                } else if (msg.type === 'voice') {
                    content = `<audio controls src="${msg.text}" style="max-width: 200px;"></audio>`;
                } else {
                    content = `${msg.text}`;
                }

                div.innerHTML = `<div class="msg-bubble">${content}<div class="msg-time">${msg.time} ${checkmark}</div></div>`;
                div.oncontextmenu = (e) => { e.preventDefault(); showCtxMenu(msg.key, msg); };
                container.appendChild(div);
            });
            setTimeout(() => container.scrollTop = container.scrollHeight, 10);
        }

        window.showCtxMenu = function(key, msg) {
            ctxMsgKey = key; ctxMsgData = msg;
            document.getElementById('ctxMenu').classList.add('active');
        };
        window.closeCtxMenu = function(e) {
            if (!e || e.target.id === 'ctxMenu' || e.type === 'click') document.getElementById('ctxMenu').classList.remove('active');
        };
        window.ctxDelete = function() {
            let chatID = currentChatID === 'FAVORITES' ? userID + '_FAVORITES' : [userID, currentChatID].sort().join('_');
            update(ref(db, `messages/${chatID}/${ctxMsgKey}`), { text: 'Удалено', type: 'text' });
            closeCtxMenu();
        };

        window.sendMessage = async function() {
            if (!currentChatID || isSending) return;
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            
            isSending = true;
            let chatID = currentChatID === 'FAVORITES' ? userID + '_FAVORITES' : [userID, currentChatID].sort().join('_');
            
            try {
                await push(ref(db, 'messages/' + chatID), {
                    sender: userID, text: text, time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), timestamp: serverTimestamp(), type: 'text'
                });
                input.value = '';
                localStorage.removeItem(`vox_draft_${[userID, currentChatID].sort().join('_')}`);
            } catch (e) { alert('Ошибка: ' + e.message); } 
            finally { isSending = false; }
        };

        window.handleKeyPress = function(event) { if (event.key === 'Enter') sendMessage(); };
        window.openImagePicker = function() { document.getElementById('imageInput').click(); };
        window.sendImage = function(event) {
            const file = event.target.files[0];
            if (!file || !currentChatID) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                let chatID = currentChatID === 'FAVORITES' ? userID + '_FAVORITES' : [userID, currentChatID].sort().join('_');
                await push(ref(db, 'messages/' + chatID), {
                    sender: userID, text: e.target.result, type: 'image', time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), timestamp: serverTimestamp()
                });
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        };

        window.startVoiceRecord = async function() {
            if (isRecording) { stopVoiceRecord(); return; }
            if (!currentChatID) return alert('Выберите чат!');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        let chatID = currentChatID === 'FAVORITES' ? userID + '_FAVORITES' : [userID, currentChatID].sort().join('_');
                        await push(ref(db, 'messages/' + chatID), {
                            sender: userID, text: reader.result, type: 'voice', time: new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }), timestamp: serverTimestamp()
                        });
                    };
                };

                mediaRecorder.start();
                isRecording = true;
                document.getElementById('voiceBtn').innerText = '⏹️';
                setTimeout(() => { if (isRecording) stopVoiceRecord(); }, 15000);
            } catch (err) {
                alert("Ошибка микрофона: " + err.message);
            }
        };

        function stopVoiceRecord() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                isRecording = false;
                document.getElementById('voiceBtn').innerText = '🎙️';
            }
        }

        window.searchFriend = async function() {
            let rawInput = document.getElementById('friendSearchInput').value;
            let queryID = rawInput.trim().toUpperCase().replace(/\s+/g, '');
            
            const resultEl = document.getElementById('searchResult');
            if (!queryID) return;

            if (queryID === 'VOX-BOT' || queryID === 'БОТ' || queryID === 'VOX-БОТ') {
                return resultEl.innerHTML = `<b>Vox Бот</b><br><button class="action-btn btn-primary" onclick="addFriend('VOX-BOT')" style="margin-top:10px;">Написать</button>`;
            }

            let foundUid = null;
            for (const [uid, data] of Object.entries(usersDB)) {
                if (data.voxId === queryID) { foundUid = uid; break; }
            }

            if (foundUid) {
                resultEl.innerHTML = `<b>${usersDB[foundUid].name}</b><br><button class="action-btn btn-primary" onclick="addFriend('${foundUid}')" style="margin-top:10px;">Написать</button>`;
            } else {
                resultEl.innerText = 'Пользователь не найден.';
                resultEl.style.color = 'var(--danger)';
            }
        };

        window.addFriend = async function(friendID) {
            await set(ref(db, `user_chats/${userID}/${friendID}`), true);
            await set(ref(db, `user_chats/${friendID}/${userID}`), true);
            closeModal('add-friend-modal');
            openChat(friendID, friendID === 'VOX-BOT' ? 'Vox Бот' : usersDB[friendID].name);
        };

        window.openProfileModal = function() {
            if (!currentChatID) return;
            const friendData = usersDB[currentChatID] || {};
            document.getElementById('viewProfileName').innerText = friendData.name || 'Собеседник';
            document.getElementById('viewProfileId').innerText = friendData.voxId || currentChatID;
            openModal('view-profile-modal');
        };

        window.openEditProfile = function() { openModal('edit-profile-modal'); };
        window.saveProfile = async function() {
            const newName = document.getElementById('editNameInput').value.trim();
            if (newName) {
                await update(ref(db, 'users/' + userID), { name: newName });
                closeModal('edit-profile-modal');
            }
        };

        window.openModal = function(id) { document.getElementById(id).classList.add('active'); };
        window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };
        window.overlayClick = function(e, id) { if (e.target.id === id) closeModal(id); };
        
        window.openLogoutModal = function() { openModal('logout-modal'); };
        window.confirmLogout = async function() { await signOut(auth); location.reload(); };
        
        window.copyMyId = function() {
            navigator.clipboard.writeText(usersDB[userID].voxId);
            alert('VOX TAG скопирован!');
        };

        window.changeTheme = function(theme) {
            document.body.className = '';
            if (theme !== 'default') document.body.classList.add(theme + '-theme');
            localStorage.setItem('voxTheme', theme);
        };

        window.addEventListener('load', () => {
            const savedTheme = localStorage.getItem('voxTheme') || 'default';
            changeTheme(savedTheme);
        });
    </script>
</body>
</html>
