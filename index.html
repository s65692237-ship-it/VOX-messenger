<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vox Messenger</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#17212b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        :root {
            --bg-color: #0e1621; --sidebar-bg: #17212b; --chat-bg: #0e1621; --header-bg: #17212b;
            --border-color: #101921; --text-main: #ffffff; --text-muted: #708499;
            --accent: #2b5278; --accent-hover: #3872a8; --msg-in: #182533; --msg-out: #2b5278;
            --msg-out-text: #ffffff; --msg-in-text: #ffffff; --input-bg: #17212b; --input-border: #2b5278;
            --online: #31c48d; --danger: #ef4444; --chat-wallpaper: none;
            --radius-msg: 12px; --radius-input: 20px;
        }

        body.light-theme {
            --bg-color: #ffffff; --sidebar-bg: #ffffff; --chat-bg: #e6ebee; --header-bg: #ffffff;
            --border-color: #e0e0e0; --text-main: #000000; --text-muted: #999999; --accent: #3390ec;
            --accent-hover: #2b7fd4; --msg-in: #ffffff; --msg-out: #e3fee0; --msg-out-text: #000000;
            --msg-in-text: #000000; --input-bg: #ffffff; --input-border: #e0e0e0;
        }

        body.liquid-theme {
            --bg-color: #000000; --sidebar-bg: #0a0a0a; --chat-bg: #000000; --header-bg: #0a0a0a;
            --border-color: #003300; --text-main: #00ff00; --text-muted: #008800; --accent: #00ff00;
            --accent-hover: #00cc00; --msg-in: #001a00; --msg-out: #003300; --msg-out-text: #00ff00;
            --msg-in-text: #00ff00; --input-bg: #0a0a0a; --input-border: #00ff00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; height: 100dvh; overflow: hidden; background-color: var(--bg-color); color: var(--text-main); font-size: 14px; }

        /* --- ЭКРАН ВХОДА --- */
        #auth-screen { position: fixed; inset: 0; background: var(--bg-color); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .auth-box { background: var(--sidebar-bg); padding: 40px 30px; border-radius: 20px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; text-align: center; }
        .auth-box h1 { font-size: 40px; color: var(--accent); margin-bottom: 8px; letter-spacing: 3px;}
        .auth-avatar-container { width: 100px; height: 100px; border-radius: 50%; background: var(--msg-in); margin: 0 auto 20px; cursor: pointer; overflow: hidden; border: 2px solid var(--accent); display: flex; justify-content: center; align-items: center; }
        .auth-avatar-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .auth-avatar-container span { font-size: 30px; color: var(--text-muted); }
        .auth-box input[type="text"] { width: 100%; padding: 14px 20px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: var(--radius-input); color: var(--text-main); font-size: 16px; margin-bottom: 15px; outline: none; text-align: center; }
        .auth-box button { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-input); font-size: 16px; font-weight: 600; cursor: pointer; }

        /* --- УВЕДОМЛЕНИЯ --- */
        #notification-container { position: fixed; top: 20px; right: 20px; z-index: 4000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .notification { background: var(--sidebar-bg); border: 1px solid var(--border-color); padding: 12px 18px; border-radius: 12px; color: var(--text-main); min-width: 250px; animation: slideIn 0.3s forwards; display: flex; align-items: center; gap: 10px; pointer-events: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* --- ОСНОВНОЙ ИНТЕРФЕЙС --- */
        .vox-container { width: 100%; height: 100%; max-width: 1400px; max-height: 900px; background: var(--chat-bg); border: 1px solid var(--border-color); display: flex; overflow: hidden; position: relative; display: none; }

        .sidebar { width: 380px; border-right: 1px solid var(--border-color); background: var(--sidebar-bg); display: flex; flex-direction: column; transition: transform 0.3s; flex-shrink: 0; }
        .sidebar-header { padding: 10px 15px; border-bottom: 1px solid var(--border-color); background: var(--header-bg); display: flex; gap: 10px; align-items: center;}
        .search-bar { flex: 1; }
        .search-bar input { width: 100%; padding: 10px 15px; background: var(--input-bg); border: none; border-radius: 10px; color: var(--text-main); outline: none; }
        .add-btn-header { background: var(--accent); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 10px 15px; cursor: pointer; border-bottom: 1px solid var(--border-color); transition: background 0.15s; }
        .chat-item:hover, .chat-item.active { background: rgba(128,128,128,0.1); }
        .chat-item.active { background: var(--accent); }
        .chat-item.active * { color: #fff !important; }
        
        .avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); display: flex; justify-content: center; align-items: center; font-weight: 600; margin-right: 12px; overflow: hidden; color: #fff; font-size: 20px; flex-shrink: 0; position: relative;}
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .online-dot { position: absolute; bottom: 2px; right: 2px; width: 12px; height: 12px; background: var(--online); border: 2px solid var(--sidebar-bg); border-radius: 50%; display: none;}
        .chat-item.online .online-dot { display: block; }

        .chat-info { flex: 1; overflow: hidden; }
        .chat-row-1 { display: flex; justify-content: space-between; margin-bottom: 2px;}
        .chat-name { font-weight: 600; font-size: 15px; color: var(--text-main); }
        .chat-time { font-size: 12px; color: var(--text-muted); }
        .chat-last-msg { font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .unread-badge { background: var(--online); color: #fff; border-radius: 10px; padding: 2px 6px; font-size: 11px; font-weight: 600; margin-left: 5px; display: none; }
        .chat-item.has-unread .unread-badge { display: block; }
        .chat-item.has-unread .chat-last-msg { color: var(--text-main); font-weight: 600; }

        .my-profile-bar { padding: 10px 15px; border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; background: var(--header-bg); cursor: pointer; }
        .my-profile-bar .avatar { width: 40px; height: 40px; font-size: 16px; }
        .my-profile-info { flex: 1; }
        .my-profile-name { font-weight: 600; font-size: 14px; }
        .my-profile-id { font-size: 12px; color: var(--text-muted); }
        .icon-btn-sm { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; padding: 5px; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); position: relative; background-image: var(--chat-wallpaper); background-size: cover; }
        .chat-header { padding: 8px 15px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; background: var(--header-bg); z-index: 2; min-height: 56px; cursor: pointer; }
        .back-btn { display: none; background: none; border: none; color: var(--text-main); font-size: 24px; margin-right: 10px; width: 30px; height: 30px; line-height: 1; align-items: center; justify-content: center; }
        .chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; margin-right: 12px; background: var(--accent); display: flex; justify-content: center; align-items: center; color: #fff; font-weight: 600; overflow: hidden; position: relative;}
        .chat-header-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-header-info { font-size: 15px; font-weight: 600; }
        .chat-header-status { font-size: 12px; color: var(--text-muted); }

        .messages { flex: 1; padding: 15px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
        .message { max-width: 75%; display: flex; flex-direction: column; position: relative; margin-bottom: 6px; animation: popIn 0.15s; }
        @keyframes popIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.incoming { align-self: flex-start; }
        .message.outgoing { align-self: flex-end; align-items: flex-end; }
        .msg-bubble { padding: 8px 12px; border-radius: var(--radius-msg); font-size: 15px; line-height: 1.35; word-wrap: break-word; }
        .message.incoming .msg-bubble { background: var(--msg-in); color: var(--msg-in-text); border-bottom-left-radius: 4px; }
        .message.outgoing .msg-bubble { background: var(--msg-out); color: var(--msg-out-text); border-bottom-right-radius: 4px; }
        
        .reply-quote { font-size: 13px; color: var(--accent); border-left: 2px solid var(--accent); padding-left: 8px; margin-bottom: 6px; font-style: italic; }
        .message.outgoing .reply-quote { color: #fff; border-left-color: #fff; }
        .reaction { position: absolute; bottom: -8px; background: var(--sidebar-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 1px 6px; font-size: 12px; z-index: 1; }
        .message.incoming .reaction { left: 10px; }
        .message.outgoing .reaction { right: 10px; }
        .msg-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; text-align: right; }
        .checkmarks { display: inline-block; margin-left: 4px; color: var(--accent); font-size: 10px;}

        .input-area { padding: 8px 15px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; background: var(--header-bg); align-items: flex-end; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
        .icon-btn { background: none; border: none; font-size: 22px; color: var(--text-muted); cursor: pointer; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; }
        .input-wrapper { flex: 1; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: var(--radius-input); padding: 4px 12px; display: flex; align-items: center; }
        .input-area input { flex: 1; padding: 8px 0; background: transparent; border: none; color: var(--text-main); outline: none; font-size: 15px; }
        .send-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; flex-shrink: 0;}
        .send-btn svg { width: 20px; height: 20px; fill: #fff; margin-left: 2px;}

        /* --- МОДАЛКИ --- */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 3000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: rgba(23, 33, 43, 0.95); backdrop-filter: blur(10px); border-radius: 16px; width: 100%; max-width: 400px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        body.light-theme .modal-card { background: rgba(255, 255, 255, 0.95); }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 18px; margin: 0; }
        .close-x { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .modal-body { padding: 20px; overflow-y: auto; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; }
        
        .btn-primary { padding: 12px; background: var(--accent); border: none; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; flex: 1; }
        .btn-secondary { padding: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); font-weight: 600; cursor: pointer; flex: 1; }
        .btn-danger { padding: 12px; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); border-radius: 10px; color: var(--danger); font-weight: 600; cursor: pointer; flex: 1; }

        .modal-body input { width: 100%; padding: 12px 15px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: var(--text-main); margin-bottom: 15px; outline: none; }
        
        .settings-tabs { display: flex; border-bottom: 1px solid var(--border-color); }
        .settings-tab { flex: 1; padding: 12px; background: none; border: none; color: var(--text-muted); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; }
        .settings-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .settings-pane { display: none; padding: 20px; }
        .settings-pane.active { display: block; }
        .settings-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .settings-btn-group { display: flex; gap: 5px; flex-wrap: wrap; }
        .settings-opt { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); cursor: pointer; }
        .settings-opt.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .color-palette { display: flex; gap: 8px; flex-wrap: wrap; }
        .color-swatch { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-swatch.selected { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); transform: scale(1.1); }

        .wallpaper-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .wallpaper-item { aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent; background-size: cover; }
        .wallpaper-item.selected { border-color: var(--accent); }
        .wallpaper-item.none { background: var(--input-bg); display: flex; justify-content: center; align-items: center; font-size: 12px; color: var(--text-muted); }

        /* --- МОБИЛЬНАЯ ВЕРСИЯ --- */
        @media (max-width: 768px) {
            .vox-container { border-radius: 0; border: none; }
            .sidebar { width: 100%; position: absolute; z-index: 10; height: 100%; transition: transform 0.3s; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; position: absolute; z-index: 5; height: 100%; transform: translateX(100%); transition: transform 0.3s; }
            .chat-area.active { transform: translateX(0); }
            .back-btn { display: flex; }
            .chat-header { padding-top: max(8px, env(safe-area-inset-top)); }
            .message { max-width: 85%; }
            .modal-card { max-width: 100%; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(128,128,128,0.5); }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h1>VOX</h1>
            <p style="color:var(--text-muted); margin-bottom:20px;">Создайте профиль</p>
            <div class="auth-avatar-container" onclick="document.getElementById('authAvatarInput').click()">
                <img id="authAvatarImg" src="" alt="Avatar">
                <span id="authAvatarText">📷</span>
            </div>
            <input type="file" id="authAvatarInput" accept="image/*" style="display: none;" onchange="processAvatar(event, 'auth')">
            <input type="text" id="usernameInput" placeholder="Ваш никнейм" maxlength="15">
            <button onclick="login()">ВОЙТИ</button>
        </div>
    </div>

    <div id="notification-container"></div>

    <div class="vox-container" id="mainApp">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="search-bar"><input type="text" id="searchInput" placeholder="Поиск..." oninput="filterChats()"></div>
                <button class="add-btn-header" onclick="openModal('settings-modal')">+</button>
            </div>
            <div class="chat-list" id="chatList"></div>
            <div class="my-profile-bar" onclick="openEditProfile()">
                <div class="avatar" id="myAvatarContainer">
                    <img id="myAvatarImg" src="" alt="Avatar" style="display:none;">
                    <span id="myAvatarText">?</span>
                    <div class="online-dot" style="display:block;"></div>
                </div>
                <div class="my-profile-info">
                    <div class="my-profile-name" id="myName">Гость</div>
                    <div class="my-profile-id" id="myID">ID: ...</div>
                </div>
                <button class="icon-btn-sm" onclick="event.stopPropagation(); openModal('settings-modal')">⚙️</button>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="chat-header" onclick="openProfileModal()">
                <button class="back-btn" onclick="event.stopPropagation(); closeChat()">←</button>
                <div class="chat-header-avatar" id="headerAvatarContainer">
                    <img id="headerAvatarImg" src="" style="display:none;">
                    <span id="headerAvatarText">?</span>
                </div>
                <div>
                    <div class="chat-header-info" id="headerName">Выберите чат</div>
                    <div class="chat-header-status" id="typingStatus"></div>
                </div>
            </div>
            
            <div class="messages" id="messagesContainer">
                 <div style="text-align:center; color:var(--text-muted); margin-top:50px;">Выберите чат для начала общения</div>
            </div>

            <div class="reply-indicator" id="replyIndicator" style="display:none; padding: 8px 15px; background: var(--header-bg); border-top: 1px solid var(--border-color); align-items: center; gap: 10px;">
                <div id="replyIndicatorContent" style="flex:1; font-size:12px; color:var(--text-muted); border-left:2px solid var(--accent); padding-left:8px;"></div>
                <button onclick="cancelReply()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:18px;">✕</button>
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="msgInput" placeholder="Сообщение..." onkeypress="handleKeyPress(event)">
                </div>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ ПРОФИЛЯ -->
    <div class="modal-overlay" id="edit-profile-modal" onclick="closeModal('edit-profile-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header"><h2>Мой профиль</h2><button class="close-x" onclick="closeModal('edit-profile-modal')">×</button></div>
            <div class="modal-body" style="text-align:center;">
                <div class="auth-avatar-container" style="margin: 0 auto 20px;" onclick="document.getElementById('editAvatarInput').click()">
                    <img id="editAvatarImg" src="" style="display:none;">
                    <span id="editAvatarText">📷</span>
                </div>
                <input type="file" id="editAvatarInput" accept="image/*" style="display: none;" onchange="processAvatar(event, 'edit')">
                <input type="text" id="editNameInput" placeholder="Новое имя" maxlength="15">
                <input type="text" id="editIdInput" disabled style="opacity:0.6; text-align:center;">
                <input type="text" id="editBioInput" placeholder="О себе (статус)" maxlength="30">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('edit-profile-modal')">Отмена</button>
                <button class="btn-primary" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА НАСТРОЕК -->
    <div class="modal-overlay" id="settings-modal" onclick="closeModal('settings-modal')">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div class="modal-header"><h2>Настройки</h2><button class="close-x" onclick="closeModal('settings-modal')">×</button></div>
            <div class="settings-tabs">
                <button class="settings-tab active" onclick="switchTab('appearance', this)">Вид</button>
                <button class="settings-tab" onclick="switchTab('profile', this)">Профиль</button>
                <button class="settings-tab" onclick="switchTab('data', this)">Данные</button>
            </div>
            <div class="modal-body" style="padding:0;">
                <div class="settings-pane active" id="pane-appearance">
                    <div class="settings-row">
                        <span>Тема</span>
                        <div class="settings-btn-group" id="themeGroup">
                            <button class="settings-opt" onclick="changeTheme('default')">Тёмная</button>
                            <button class="settings-opt" onclick="changeTheme('light')">Светлая</button>
                            <button class="settings-opt" onclick="changeTheme('liquid')">Матрица</button>
                        </div>
                    </div>
                    <div class="settings-row">
                        <span>Цвет пузырей</span>
                        <div class="color-palette" id="colorPalette">
                            <div class="color-swatch" data-color="#2b5278" style="background:#2b5278" onclick="changeBubbleColor('#2b5278')"></div>
                            <div class="color-swatch" data-color="#8b5cf6" style="background:#8b5cf6" onclick="changeBubbleColor('#8b5cf6')"></div>
                            <div class="color-swatch" data-color="#10b981" style="background:#10b981" onclick="changeBubbleColor('#10b981')"></div>
                            <div class="color-swatch" data-color="#ef4444" style="background:#ef4444" onclick="changeBubbleColor('#ef4444')"></div>
                        </div>
                    </div>
                    <div class="settings-row" style="flex-direction:column; align-items:flex-start;">
                        <span style="margin-bottom:10px;">Обои чата</span>
                        <div class="wallpaper-grid" id="wallpaperGrid">
                            <div class="wallpaper-item none" onclick="changeWallpaper('none')">Нет</div>
                            <div class="wallpaper-item" style="background:linear-gradient(135deg, #667eea, #764ba2)" onclick="changeWallpaper('linear-gradient(135deg, #667eea, #764ba2)')"></div>
                            <div class="wallpaper-item" style="background:linear-gradient(135deg, #f093fb, #f5576c)" onclick="changeWallpaper('linear-gradient(135deg, #f093fb, #f5576c)')"></div>
                            <div class="wallpaper-item" style="background:linear-gradient(135deg, #43e97b, #38f9d7)" onclick="changeWallpaper('linear-gradient(135deg, #43e97b, #38f9d7)')"></div>
                        </div>
                    </div>
                </div>
                <div class="settings-pane" id="pane-profile">
                    <p style="text-align:center; color:var(--text-muted); margin-bottom:15px;">Твой уникальный ID для друзей</p>
                    <div style="background:var(--input-bg); padding:15px; border-radius:10px; text-align:center; font-weight:600; font-size:18px; margin-bottom:15px; cursor:pointer;" onclick="copyId()" id="settingsProfileId">VOX-0000</div>
                    <button class="btn-primary" onclick="closeModal('settings-modal'); openEditProfile();" style="width:100%;">Редактировать профиль</button>
                </div>
                <div class="settings-pane" id="pane-data">
                    <button class="btn-secondary" style="width:100%; margin-bottom:10px;" onclick="addBot()">Добавить Vox Бота (для теста)</button>
                    <button class="btn-danger" style="width:100%;" onclick="confirmLogout()">Выйти (удалить всё)</button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage(event)">

    <script>
        // --- БАЗА ДАННЫХ ---
        let usersDB = JSON.parse(localStorage.getItem('voxUsersDB')) || {};
        let currentUser = localStorage.getItem('voxUser') || null;
        let userID = localStorage.getItem('voxID') || null;
        let userAvatarBase64 = localStorage.getItem('voxAvatar') || null;
        let userBio = localStorage.getItem('voxBio') || 'В сети Vox!';
        let chatData = JSON.parse(localStorage.getItem('voxChats')) || {};
        
        let currentChat = null;
        let tempAvatarBase64 = null;
        let replyTo = null;
        let isSending = false;

        function generateID() { return 'VOX-' + Math.floor(1000 + Math.random() * 9000); }

        function processAvatar(event, context) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 100; canvas.height = 100;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, 100, 100);
                    tempAvatarBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    if (context === 'auth') {
                        document.getElementById('authAvatarImg').src = tempAvatarBase64;
                        document.getElementById('authAvatarImg').style.display = 'block';
                        document.getElementById('authAvatarText').style.display = 'none';
                    } else if (context === 'edit') {
                        document.getElementById('editAvatarImg').src = tempAvatarBase64;
                        document.getElementById('editAvatarImg').style.display = 'block';
                        document.getElementById('editAvatarText').style.display = 'none';
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function login() {
            const name = document.getElementById('usernameInput').value.trim();
            if (name.length < 2) return alert('Имя слишком короткое!');
            
            currentUser = name;
            if (!userID) { userID = generateID(); localStorage.setItem('voxID', userID); }
            
            usersDB[name] = { id: userID, avatar: tempAvatarBase64 || null, bio: userBio };
            localStorage.setItem('voxUsersDB', JSON.stringify(usersDB));
            localStorage.setItem('voxUser', name);
            if (tempAvatarBase64) localStorage.setItem('voxAvatar', tempAvatarBase64);
            
            showMainApp();
            showNotification('Добро пожаловать!', 'Ваш ID: ' + userID);
        }

        function showMainApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            updateMyProfileUI();
            renderChatList();
        }

        function updateMyProfileUI() {
            document.getElementById('myName').innerText = currentUser;
            document.getElementById('myID').innerText = 'ID: ' + userID;
            document.getElementById('settingsProfileId').innerText = userID;
            
            if (userAvatarBase64) {
                document.getElementById('myAvatarImg').src = userAvatarBase64;
                document.getElementById('myAvatarImg').style.display = 'block';
                document.getElementById('myAvatarText').style.display = 'none';
            } else {
                document.getElementById('myAvatarText').innerText = currentUser[0].toUpperCase();
            }
        }

        function renderChatList() {
            const container = document.getElementById('chatList');
            container.innerHTML = '';
            
            if (Object.keys(chatData).length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:40px 20px;">Нет чатов. Зайди в настройки -> Данные -> Добавить Бота.</div>';
                return;
            }
            
            Object.keys(chatData).forEach(name => {
                const msgs = chatData[name];
                let lastMsg = 'Нет сообщений';
                let lastTime = '';
                if (msgs.length > 0) {
                    const last = msgs[msgs.length - 1];
                    lastMsg = last.text.length > 25 ? last.text.substring(0, 25)+'...' : last.text;
                    lastTime = last.time || '';
                }
                
                const isUnread = msgs.length > 0 && msgs[msgs.length - 1].type === 'incoming' && name !== currentChat;
                
                const div = document.createElement('div');
                div.className = 'chat-item' + (name === currentChat ? ' active' : '');
                if (name === 'Vox Бот') div.classList.add('online');
                if (isUnread) div.classList.add('has-unread');
                
                div.onclick = () => openChat(name);
                div.innerHTML = `
                    <div class="avatar">
                        ${usersDB[name]?.avatar ? `<img src="${usersDB[name].avatar}">` : name[0].toUpperCase()}
                        <div class="online-dot"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-row-1">
                            <div class="chat-name">${name}</div>
                            <div class="chat-time">${lastTime}</div>
                        </div>
                        <div class="chat-row-2" style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="chat-last-msg">${lastMsg}</div>
                            <div class="unread-badge">1</div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function openChat(name) {
            currentChat = name;
            cancelReply();
            document.getElementById('msgInput').value = '';
            
            document.getElementById('headerName').innerText = name;
            document.getElementById('typingStatus').innerText = name === 'Vox Бот' ? 'онлайн' : 'был(а) недавно';
            
            const avatarImg = document.getElementById('headerAvatarImg');
            const avatarTxt = document.getElementById('headerAvatarText');
            
            if (usersDB[name]?.avatar) {
                avatarImg.src = usersDB[name].avatar;
                avatarImg.style.display = 'block';
                avatarTxt.style.display = 'none';
            } else {
                avatarImg.style.display = 'none';
                avatarTxt.innerText = name[0].toUpperCase();
                avatarTxt.style.display = 'block';
            }

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('hidden');
                document.getElementById('chatArea').classList.add('active');
            }
            
            renderChatList();
            renderMessages();
            // Скролл вниз при открытии
            setTimeout(() => {
                const c = document.getElementById('messagesContainer');
                c.scrollTop = c.scrollHeight;
            }, 50);
        }

        function closeChat() {
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('chatArea').classList.remove('active');
            currentChat = null;
            renderChatList();
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            if (!currentChat || !chatData[currentChat]) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:50px;">Выберите чат</div>';
                return;
            }
            
            container.innerHTML = '';
            chatData[currentChat].forEach((msg, index) => {
                const div = document.createElement('div');
                div.className = `message ${msg.type}`;
                
                let replyHtml = msg.reply ? `<div class="reply-quote">${msg.reply}</div>` : '';
                
                div.oncontextmenu = (e) => {
                    e.preventDefault();
                    if (confirm('Удалить это сообщение?')) {
                        chatData[currentChat].splice(index, 1);
                        localStorage.setItem('voxChats', JSON.stringify(chatData));
                        renderMessages();
                        renderChatList();
                    }
                };
                
                div.ondblclick = () => {
                    chatData[currentChat][index].reaction = chatData[currentChat][index].reaction === '❤️' ? null : '❤️';
                    localStorage.setItem('voxChats', JSON.stringify(chatData));
                    renderMessages();
                };

                if (msg.text.startsWith('emoji:')) {
                    const emoji = msg.text.replace('emoji:', '');
                    div.innerHTML = `<div style="font-size: 40px;">${emoji}</div><div class="msg-time">${msg.time}</div>`;
                } else if (msg.text.startsWith('data:image')) {
                    div.innerHTML = `<div class="msg-bubble"><img src="${msg.text}" style="max-width:200px; border-radius:8px;"></div><div class="msg-time">${msg.time}</div>`;
                } else {
                    const formattedText = msg.text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--accent); text-decoration:underline;">$1</a>');
                    const check = msg.type === 'outgoing' ? '<span class="checkmarks">✓✓</span>' : '';
                    div.innerHTML = `${replyHtml}<div class="msg-bubble">${formattedText}</div><div class="msg-time">${msg.time} ${check}</div>${msg.reaction ? `<div class="reaction">${msg.reaction}</div>` : ''}`;
                }
                
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            if (!currentChat || isSending) return;
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            isSending = true;
            const time = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
            
            if (!chatData[currentChat]) chatData[currentChat] = [];
            chatData[currentChat].push({ text: text, type: 'outgoing', time: time, reply: replyTo });
            
            localStorage.setItem('voxChats', JSON.stringify(chatData));
            renderMessages();
            renderChatList();
            input.value = '';
            cancelReply();

            if (currentChat === 'Vox Бот') {
                document.getElementById('typingStatus').innerText = 'печатает...';
                setTimeout(() => {
                    let botReply = "";
                    const lowerText = text.toLowerCase();
                    
                    if (lowerText.includes('привет') || lowerText.includes('здарова')) botReply = "Здарова, братик! Как сам?";
                    else if (lowerText.includes('кс') || lowerText.includes('cs') || lowerText.includes('го')) botReply = "В CS2? Я бы сыграл, но у меня руки из кода. Давай в VOX: FRONTLINE!";
                    else if (lowerText.includes('дела')) botReply = "Да всё чики-пуки. Код пишу, баги фикшу.";
                    else if (lowerText.includes('дурак') || lowerText.includes('тупой')) botReply = "Сам такой! Я же нейросеть, я обижусь.";
                    else {
                        const replies = ["Согласен.", "Круто!", "Давай потом?", "Ясно.", "Ага.", "Норм.", "Ок.", "Слышал, ты в Томске живешь?"];
                        botReply = replies[Math.floor(Math.random() * replies.length)];
                    }
                    
                    chatData[currentChat].push({ text: botReply, type: 'incoming', time: new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) });
                    localStorage.setItem('voxChats', JSON.stringify(chatData));
                    
                    if (currentChat === 'Vox Бот') {
                        document.getElementById('typingStatus').innerText = 'онлайн';
                        renderMessages();
                    }
                    renderChatList();
                    isSending = false;
                }, 1200);
            } else {
                isSending = false;
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

        function openImagePicker() { document.getElementById('imageInput').click(); }
        function sendImage(event) {
            const file = event.target.files[0];
            if (!file || !currentChat) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const time = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
                chatData[currentChat].push({ text: e.target.result, type: 'outgoing', time: time });
                localStorage.setItem('voxChats', JSON.stringify(chatData));
                renderMessages();
                renderChatList();
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function changeTheme(theme) {
            document.body.className = '';
            if (theme === 'light') document.body.classList.add('light-theme');
            if (theme === 'liquid') document.body.classList.add('liquid-theme');
            localStorage.setItem('voxTheme', theme);
            highlightSettings();
        }
        function changeBubbleColor(color) {
            document.documentElement.style.setProperty('--msg-out', color);
            localStorage.setItem('voxBubbleColor', color);
            highlightSettings();
        }
        function changeWallpaper(wp) {
            document.documentElement.style.setProperty('--chat-wallpaper', wp === 'none' ? 'none' : wp);
            localStorage.setItem('voxWallpaper', wp);
            highlightSettings();
        }
        function highlightSettings() {
            document.querySelectorAll('#themeGroup .settings-opt').forEach(el => el.classList.remove('active'));
            const t = localStorage.getItem('voxTheme') || 'default';
            document.querySelectorAll('#themeGroup .settings-opt').forEach(el => { if (el.getAttribute('onclick').includes(t)) el.classList.add('active'); });
            
            document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
            const c = localStorage.getItem('voxBubbleColor');
            if (c) document.querySelectorAll('.color-swatch').forEach(el => { if (el.dataset.color === c) el.classList.add('selected'); });
        }

        function openEditProfile() {
            document.getElementById('editNameInput').value = currentUser;
            document.getElementById('editIdInput').value = userID;
            document.getElementById('editBioInput').value = userBio;
            if (userAvatarBase64) {
                document.getElementById('editAvatarImg').src = userAvatarBase64;
                document.getElementById('editAvatarImg').style.display = 'block';
                document.getElementById('editAvatarText').style.display = 'none';
            }
            openModal('edit-profile-modal');
        }

        function saveProfile() {
            const newName = document.getElementById('editNameInput').value.trim();
            const newBio = document.getElementById('editBioInput').value.trim();
            if (newName.length < 2) return alert('Слишком коротко!');
            
            if (newName !== currentUser) {
                delete usersDB[currentUser];
                usersDB[newName] = { id: userID, avatar: tempAvatarBase64 || userAvatarBase64, bio: newBio };
                currentUser = newName;
                localStorage.setItem('voxUser', newName);
                localStorage.setItem('voxUsersDB', JSON.stringify(usersDB));
            } else {
                usersDB[currentUser].bio = newBio;
                localStorage.setItem('voxUsersDB', JSON.stringify(usersDB));
            }
            
            userBio = newBio;
            localStorage.setItem('voxBio', newBio);
            
            if (tempAvatarBase64) {
                userAvatarBase64 = tempAvatarBase64;
                localStorage.setItem('voxAvatar', userAvatarBase64);
            }
            updateMyProfileUI();
            closeModal('edit-profile-modal');
            showNotification('Профиль', 'Сохранено!');
        }

        function copyId() {
            navigator.clipboard.writeText(userID).then(() => {
                showNotification('ID', 'Скопирован в буфер обмена!');
            });
        }

        function confirmLogout() {
            if(confirm('Удалить все данные?')) {
                localStorage.clear();
                location.reload();
            }
        }

        function addBot() {
            if (!chatData['Vox Бот']) {
                chatData['Vox Бот'] = [{ text: "Привет! Я тестовый бот. Напиши мне 'привет' или 'кс'!", type: 'incoming', time: new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) }];
                usersDB['Vox Бот'] = { id: 'VOX-BOT', avatar: null, bio: 'Официальный бот Vox' };
                localStorage.setItem('voxChats', JSON.stringify(chatData));
                localStorage.setItem('voxUsersDB', JSON.stringify(usersDB));
                renderChatList();
                openChat('Vox Бот');
                closeModal('settings-modal');
            } else {
                alert('Бот уже добавлен!');
            }
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function switchTab(tab, btn) {
            document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.settings-pane').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('pane-' + tab).classList.add('active');
        }

        function showNotification(title, text) {
            const container = document.getElementById('notification-container');
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.innerHTML = `<div>💬</div><div><b>${title}</b><br>${text}</div>`;
            container.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }

        function cancelReply() {
            replyTo = null;
            document.getElementById('replyIndicator').style.display = 'none';
        }

        function openProfileModal() {
            if (!currentChat) return;
            const bio = usersDB[currentChat]?.bio || 'Нет статуса';
            showNotification('Профиль ' + currentChat, bio + ' | ID: ' + (usersDB[currentChat]?.id || 'N/A'));
        }

        function filterChats() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            document.querySelectorAll('.chat-item').forEach(item => {
                const name = item.querySelector('.chat-name').innerText.toLowerCase();
                item.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        window.onload = () => {
            if (localStorage.getItem('voxTheme')) changeTheme(localStorage.getItem('voxTheme'));
            if (localStorage.getItem('voxBubbleColor')) document.documentElement.style.setProperty('--msg-out', localStorage.getItem('voxBubbleColor'));
            if (localStorage.getItem('voxWallpaper')) document.documentElement.style.setProperty('--chat-wallpaper', localStorage.getItem('voxWallpaper'));
            
            if (currentUser && userID) {
                showMainApp();
            }
            highlightSettings();
        };
    </script>
</body>
</html>
